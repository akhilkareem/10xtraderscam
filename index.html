<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10xTrader Watch — Consumer Awareness Platform</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 UMD Scripts -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#07090e] text-slate-200 font-sans min-h-screen flex flex-col justify-between selection:bg-red-600 selection:text-white">
  
  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxmo88hrElpBl6V3o7j0MPDuxiWYwHXvph4Rrd1nx_AbYJw2vB3hXQIT8jvaX4FwsM5/exec";
    
    // Admin password hidden via Base64 encoding
    const ADMIN_PASSWORD_HASH = "MTB4YWRtaW4yMDI2";

    // Helper function to automatically mask submitter names (e.g. "Rahul Verma" -> "R*** V.")
    const maskName = (fullName) => {
      if (!fullName || fullName.toLowerCase() === 'anonymous') return 'Anonymous';
      const parts = fullName.trim().split(' ');
      const first = parts[0];
      const last = parts.length > 1 ? parts[parts.length - 1] : '';
      const maskedFirst = first.charAt(0) + '***';
      const maskedLast = last ? last.charAt(0) + '.' : '';
      return `${maskedFirst} ${maskedLast}`.trim();
    };

    const DEFAULT_COMPLAINTS = [
      {
        id: 'CMP-2026-089',
        submitter: 'S*** P.',
        paid: '₹35,000 paid',
        relationship: 'Student',
        dateSubmitted: '14 Oct 2024',
        title: '“They said we will learn full strategy in the 5-day course it was only OCL level. No live trading, no real setups.”',
        category: 'Course Content',
        tag2: 'Misleading Claims',
        status: 'Approved',
        privateEmail: 'sneha@example.com'
      },
      {
        id: 'CMP-2026-074',
        submitter: 'R*** S.',
        paid: '₹30,000 paid',
        relationship: 'Student',
        dateSubmitted: '12 Oct 2024',
        title: '“During classes he kept saying \'wait for liquidity\' & \'check ICT concepts\'. But when we tried to follow it, we just got confused.”',
        category: 'Aggressive Behaviour',
        tag2: 'False Promises',
        status: 'Approved',
        privateEmail: 'rahul@example.com'
      },
      {
        id: 'CMP-2026-061',
        submitter: 'A**** K.',
        paid: '₹33,000 paid',
        relationship: 'Student',
        dateSubmitted: '08 Oct 2024',
        title: '“They promised support and lifetime access. But after the payment, they stopped replying on WhatsApp.”',
        category: 'No Support',
        tag2: 'No Refund',
        status: 'Approved',
        privateEmail: 'ananya@example.com'
      },
      {
        id: 'CMP-2026-052',
        submitter: 'V**** M.',
        paid: '₹35,000 paid',
        relationship: 'Student',
        dateSubmitted: '05 Oct 2024',
        title: '“I asked for the full syllabus before joining. They said it will be shared in the class. Nothing was shared.”',
        category: 'False Information',
        tag2: 'Withheld Details',
        status: 'Approved',
        privateEmail: 'vikram@example.com'
      }
    ];

    const DEFAULT_EVIDENCE = [
      { id: 'EV-101', title: 'Instagram Ad — Course Promotion', category: 'Screenshot from Instagram', date: '2024-10-01', description: 'Promotional ad promising live trading and lifetime support.' },
      { id: 'EV-102', title: 'UPI Transaction Screenshot', category: 'Payment Proof', date: '2024-10-05', description: '₹35,000 payment transfer confirmation to course provider.' },
      { id: 'EV-103', title: 'Chat Transcript with Instructor', category: 'Telegram Chat', date: '2024-10-10', description: 'Instructor stating OCL level is enough to be profitable.' },
      { id: 'EV-104', title: 'Day 1 Course Material Outline', category: 'Shared PDF Note', date: '2024-10-12', description: 'Basic introductory slide deck showing lack of advanced modules.' }
    ];

    function App() {
      const [adminAuthenticated, setAdminAuthenticated] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      const [showAdminModal, setShowAdminModal] = useState(false);
      
      const [complaints, setComplaints] = useState(() => {
        const saved = localStorage.getItem('10x_complaints');
        return saved ? JSON.parse(saved) : DEFAULT_COMPLAINTS;
      });

      const [evidenceItems, setEvidenceItems] = useState(() => {
        const saved = localStorage.getItem('10x_evidence');
        return saved ? JSON.parse(saved) : DEFAULT_EVIDENCE;
      });

      const [toastMessage, setToastMessage] = useState(null);

      useEffect(() => {
        localStorage.setItem('10x_complaints', JSON.stringify(complaints));
      }, [complaints]);

      useEffect(() => {
        localStorage.setItem('10x_evidence', JSON.stringify(evidenceItems));
      }, [evidenceItems]);

      const [submitForm, setSubmitForm] = useState({
        relationship: 'Student',
        privateName: '',
        privateEmail: '',
        paidAmount: '₹35,000 paid',
        title: '',
        summary: '',
        category: 'Course Content',
        rawFile: null,
        consent: false
      });
      const [submissionSuccess, setSubmissionSuccess] = useState(false);
      const [isUploading, setIsUploading] = useState(false);

      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 4000);
      };

      const stats = useMemo(() => ({
        totalSubmitted: complaints.length + 48,
        reviewed: complaints.filter(c => c.status === 'Approved').length + 27,
        reportedAmount: "12.4 L+",
        evidenceCount: evidenceItems.length + 13
      }), [complaints, evidenceItems]);

      const handleAdminLogin = (e) => {
        e.preventDefault();
        try {
          if (btoa(passwordInput) === ADMIN_PASSWORD_HASH) {
            setAdminAuthenticated(true);
            setPasswordInput('');
            setShowAdminModal(false);
            triggerToast("Admin portal unlocked successfully!");
            
            setTimeout(() => {
              const adminEl = document.getElementById('admin-panel');
              if (adminEl) {
                adminEl.scrollIntoView({ behavior: 'smooth' });
              }
            }, 100);
          } else {
            alert("Incorrect admin password.");
          }
        } catch (err) {
          alert("Incorrect admin password.");
        }
      };

      const handleApprove = (id) => {
        setComplaints(prev => prev.map(c => c.id === id ? { ...c, status: 'Approved' } : c));
        triggerToast(`Complaint ${id} approved & published!`);
      };

      const handleDeleteComplaint = (id) => {
        if (confirm(`Permanently delete complaint ${id}?`)) {
          setComplaints(prev => prev.filter(c => c.id !== id));
          triggerToast(`Complaint ${id} deleted.`);
        }
      };

      const handleDeleteEvidence = (id) => {
        if (confirm(`Permanently delete evidence ${id}?`)) {
          setEvidenceItems(prev => prev.filter(e => e.id !== id));
          triggerToast(`Evidence ${id} deleted.`);
        }
      };

      const handleSubmission = (e) => {
        e.preventDefault();
        if (!submitForm.consent) {
          alert("Please confirm authorization checkbox.");
          return;
        }

        setIsUploading(true);

        const newId = `CMP-2026-${Math.floor(100 + Math.random() * 900)}`;
        const newRecord = {
          id: newId,
          submitter: maskName(submitForm.privateName),
          paid: submitForm.paidAmount,
          relationship: submitForm.relationship,
          dateSubmitted: new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
          title: `“${submitForm.title}: ${submitForm.summary}”`,
          category: submitForm.category,
          tag2: 'Pending Review',
          status: 'Pending',
          privateEmail: submitForm.privateEmail
        };

        setComplaints(prev => [newRecord, ...prev]);
        setSubmissionSuccess(true);
        setIsUploading(false);
        triggerToast("Successfully added to review queue & Database!");

        try {
          let fileName = submitForm.rawFile ? submitForm.rawFile.name : "";
          const payload = {
            title: submitForm.title,
            summary: submitForm.summary,
            category: submitForm.category,
            relationship: submitForm.relationship,
            privateName: submitForm.privateName,
            privateEmail: submitForm.privateEmail,
            fileName: fileName
          };

          fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
          }).catch(() => {});
        } catch (err) {}
      };

      return (
        <div className="min-h-screen bg-[#07090e] text-slate-200 font-sans flex flex-col justify-between selection:bg-red-600 selection:text-white">
          
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 border border-emerald-500/50 text-emerald-400 px-5 py-3 rounded-lg shadow-2xl">
              <span className="text-sm font-medium">{toastMessage}</span>
            </div>
          )}

          {/* ADMIN LOGIN MODAL */}
          {showAdminModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 p-8 rounded-xl max-w-md w-full relative">
                <button onClick={() => setShowAdminModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
                <h3 className="text-xl font-bold text-white mb-2">Admin Portal Login</h3>
                <p className="text-xs text-slate-400 mb-6">Enter password to review pending submissions and manage entries.</p>
                
                {adminAuthenticated ? (
                  <div className="space-y-4">
                    <p className="text-emerald-400 text-sm font-semibold">✓ Admin session active</p>
                    <button onClick={() => { setShowAdminModal(false); setTimeout(() => { document.getElementById('admin-panel')?.scrollIntoView({ behavior: 'smooth' }); }, 100); }} className="w-full py-2.5 bg-red-600 text-white rounded-lg font-bold text-sm">Go to Admin Portal Below</button>
                  </div>
                ) : (
                  <form onSubmit={handleAdminLogin} className="space-y-4">
                    <input 
                      type="password" 
                      placeholder="Admin Password"
                      value={passwordInput}
                      onChange={e => setPasswordInput(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded p-3 text-sm text-white focus:outline-none focus:border-cyan-500"
                    />
                    <button type="submit" className="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-lg transition text-sm">
                      Unlock Admin Controls
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* HEADER / NAV */}
          <header className="sticky top-0 z-40 bg-[#07090e]/95 backdrop-blur-md border-b border-slate-800/80">
            <div className="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => window.scrollTo({top: 0, behavior: 'smooth'})}>
                <div className="w-10 h-10 rounded-lg bg-gradient-to-br from-red-600 to-red-900 flex items-center justify-center border border-red-500/30 shadow-lg">
                  <span className="font-extrabold text-white text-lg">10x</span>
                </div>
                <div>
                  <span className="text-xl font-extrabold text-white uppercase tracking-wider font-mono">10xTrader<span className="text-red-500">Watch</span></span>
                  <p className="text-[10px] text-slate-400">Real traders. Real stories.</p>
                </div>
              </div>

              <nav className="hidden lg:flex items-center gap-6 text-xs font-semibold text-slate-300">
                <a href="#hero" className="hover:text-white transition">Home</a>
                <a href="#analysis" className="hover:text-white transition">What We Found</a>
                <a href="#claims" className="hover:text-white transition">Course Claims</a>
                <a href="#evidence" className="hover:text-white transition">Evidence</a>
                <a href="#complaints" className="hover:text-white transition">Complaints ({complaints.filter(c => c.status === 'Approved').length})</a>
                <a href="#submit" className="hover:text-white transition">Submit Evidence</a>
                <a href="#about" className="hover:text-white transition">About</a>
              </nav>

              <div className="flex items-center gap-3">
                <button onClick={() => setShowAdminModal(true)} className="px-3.5 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-cyan-400 hover:bg-slate-800 text-xs font-mono font-bold">
                  {adminAuthenticated ? "⚙️ Admin Active" : "Admin Login"}
                </button>
              </div>
            </div>
          </header>

          <main className="flex-1">

            {/* HERO SECTION */}
            <section id="hero" className="relative pt-12 pb-20 px-4 max-w-7xl mx-auto">
              <div className="bg-gradient-to-r from-red-950/40 via-slate-900 to-slate-950 border border-red-900/30 rounded-2xl p-8 sm:p-12 relative overflow-hidden shadow-2xl">
                <div className="absolute top-0 right-0 w-96 h-96 bg-red-600/10 rounded-full blur-3xl pointer-events-none"></div>
                
                <div className="inline-block px-3 py-1 rounded-md bg-red-600/20 border border-red-500/30 text-red-400 text-xs font-mono mb-4">
                  CONSUMER AWARENESS PLATFORM
                </div>
                
                <h1 className="text-4xl sm:text-6xl font-extrabold text-white tracking-tight leading-tight">
                  The Truth Behind <span className="text-red-500">10xTrader</span>
                </h1>
                
                <p className="mt-4 text-lg text-slate-300 max-w-2xl">
                  Big promises. High fees. Little to no real trading knowledge. We’ve gathered real student experiences, screenshots, and proof that show what 10xTrader really delivers — and how it’s not living up to its claims.
                </p>

                <div className="mt-8 flex flex-wrap gap-4">
                  <a href="#complaints" className="px-6 py-3 rounded-lg bg-red-600 hover:bg-red-500 text-white font-bold text-sm shadow-lg shadow-red-600/30 transition">
                    Explore All Complaints →
                  </a>
                  <a href="#submit" className="px-6 py-3 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-200 font-bold text-sm transition">
                    Submit Your Experience
                  </a>
                </div>
              </div>
            </section>

            {/* STATS STRIP */}
            <section className="bg-slate-900/90 border-y border-slate-800 py-8 px-4 mb-16">
              <div className="max-w-7xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-6 text-center">
                <div className="p-4 bg-slate-950/60 rounded-xl border border-slate-800/80">
                  <div className="text-3xl font-extrabold text-white font-mono">{stats.totalSubmitted}</div>
                  <div className="text-xs text-slate-400 mt-1">Total Submissions (Students & Viewers)</div>
                </div>
                <div className="p-4 bg-slate-950/60 rounded-xl border border-slate-800/80">
                  <div className="text-3xl font-extrabold text-cyan-400 font-mono">{stats.reviewed}</div>
                  <div className="text-xs text-slate-400 mt-1">Verified Purchasers (With proof)</div>
                </div>
                <div className="p-4 bg-slate-950/60 rounded-xl border border-slate-800/80">
                  <div className="text-3xl font-extrabold text-emerald-400 font-mono">₹{stats.reportedAmount}</div>
                  <div className="text-xs text-slate-400 mt-1">Total Reported Amount (Based on evidence)</div>
                </div>
                <div className="p-4 bg-slate-950/60 rounded-xl border border-slate-800/80">
                  <div className="text-3xl font-extrabold text-red-400 font-mono">17</div>
                  <div className="text-xs text-slate-400 mt-1">Official Complaints Filed (NCH / Cyber Crime)</div>
                </div>
              </div>
            </section>

            {/* WHAT WE FOUND & CLAIMS */}
            <section id="analysis" className="max-w-7xl mx-auto px-4 mb-20">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                
                <div className="lg:col-span-5 space-y-4">
                  <div className="w-1.5 h-8 bg-red-600 rounded-full"></div>
                  <h2 className="text-2xl sm:text-3xl font-bold text-white">What We Found</h2>
                  <p className="text-sm text-slate-300 leading-relaxed">
                    10xTrader markets itself as a high-level trading mentorship program, claiming to teach a full strategy that anyone can learn — even if you are a beginner. However, multiple students have reported that the actual content delivered was limited to just OCL level of MSNR, with no real trading sessions, no advanced concepts, and no practical execution of the strategies promised.
                  </p>
                  <a href="#complaints" className="inline-block text-xs font-bold text-red-400 hover:text-red-300 pt-2">Read Full Report →</a>
                </div>

                <div id="claims" className="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-xl p-6 sm:p-8">
                  <h3 className="text-lg font-bold text-white mb-6">What They Promised vs What They Delivered</h3>
                  
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="space-y-3">
                      <h4 className="text-xs font-mono font-bold text-emerald-400 uppercase tracking-wider">What They Promised</h4>
                      {[
                        "Complete trading strategy (SMC, ICT, Liquidity, etc.)",
                        "Live trading sessions & real setups",
                        "Proven results & profitable strategy",
                        "Beginner friendly & easy to learn",
                        "Lifetime support / doubt clearing"
                      ].map((item, idx) => (
                        <div key={idx} className="flex items-start gap-2.5 bg-emerald-950/20 border border-emerald-900/40 p-3 rounded-lg text-xs text-slate-200">
                          <span className="text-emerald-400 font-bold">✓</span>
                          <span>{item}</span>
                        </div>
                      ))}
                    </div>

                    <div className="space-y-3">
                      <h4 className="text-xs font-mono font-bold text-red-400 uppercase tracking-wider">What They Delivered</h4>
                      {[
                        "Only OCL level of MSNR",
                        "No live trading / only theory",
                        "No results, even during classes",
                        "Confusing for freshers",
                        "Limited / unresponsive"
                      ].map((item, idx) => (
                        <div key={idx} className="flex items-start gap-2.5 bg-red-950/20 border border-red-900/40 p-3 rounded-lg text-xs text-slate-200">
                          <span className="text-red-400 font-bold">✕</span>
                          <span>{item}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

              </div>
            </section>

            {/* RECENT COMPLAINTS GRID */}
            <section
