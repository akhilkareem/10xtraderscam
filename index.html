<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10xTrader Watch — Consumer Awareness Platform</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#07090e] text-slate-200">
  
  <div id="root"></div>

  <!-- React Code Block -->
  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP ENDPOINT
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxmo88hrElpBl6V3o7j0MPDuxiWYwHXvph4Rrd1nx_AbYJw2vB3hXQIT8jvaX4FwsM5/exec";

    // --- INITIAL DEMO / DEFAULT STATE DATA ---
    const INITIAL_COMPLAINTS = [
      {
        id: 'CMP-2026-089',
        submitter: 'M*** K.',
        relationship: 'Student',
        courseDate: 'March 2026',
        dateSubmitted: '2026-04-12',
        title: 'Promised 1-on-1 Mentorship Was Automated Bot Messages',
        summary: 'The VIP enrollment package ($4,999) explicitly advertised daily personalized live coaching and trade reviews by the master trader. In reality, all direct support was handled by an unmonitored automated Telegram bot sending recycled chart signals from 2023.',
        category: 'Misleading Claims',
        status: 'Approved',
        evidenceCount: 3,
        evidenceRefs: ['EV-102', 'EV-105'],
        providerResponseId: 'RESP-001',
        verifiedPurchase: true,
        privateEmail: 'masked_user_89@domain.com',
        privateName: 'Marcus Vance'
      },
      {
        id: 'CMP-2026-074',
        submitter: 'Anonymous',
        relationship: 'Student',
        courseDate: 'January 2026',
        dateSubmitted: '2026-03-28',
        title: 'Refund Policy Denied After 48 Hours Despite 30-Day Guarantee',
        summary: 'The promotional page offered a "No-Questions-Asked 30-Day Refund Policy". When requested on day 5 due to missing module materials, support claimed that viewing >10% of video content rendered the account non-refundable according to hidden terms.',
        category: 'Refund Policy',
        status: 'Approved',
        evidenceCount: 2,
        evidenceRefs: ['EV-101'],
        providerResponseId: null,
        verifiedPurchase: true,
        privateEmail: 'anon_trader_74@private.net',
        privateName: 'Sarah Jenkins'
      },
      {
        id: 'CMP-2026-061',
        submitter: 'D*** P.',
        relationship: 'Student',
        courseDate: 'November 2025',
        dateSubmitted: '2026-02-15',
        title: 'Live Trading Room Consisted of Pre-Recorded Video Loops',
        summary: 'Subscribers paying $299/month for access to the live session room noticed that the trades presented in real-time matched historical recordings frame-for-frame during dynamic market news releases.',
        category: 'Course Content',
        status: 'Approved',
        evidenceCount: 4,
        evidenceRefs: ['EV-103', 'EV-104'],
        providerResponseId: null,
        verifiedPurchase: true,
        privateEmail: 'd.p_trader@mail.org',
        privateName: 'David Park'
      }
    ];

    const INITIAL_EVIDENCE = [
      {
        id: 'EV-101',
        title: 'Refund Policy Sales Page Screenshot',
        category: 'Course Advertisements',
        date: '2026-03-29',
        description: 'High-resolution archive of promotional landing page displaying bold "30-Day Risk-Free Guarantee" text without restrictive disclaimers.',
        redactedUrl: 'https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=800&q=80',
        status: 'Verified',
        gdriveId: '1A2b3C4d5E6f7G8h9I_EV101',
        redactionNotes: 'PII removed: Customer IP, specific session checkout tokens.'
      },
      {
        id: 'EV-102',
        title: 'Telegram Support Log Transcript',
        category: 'Chat Excerpts',
        date: '2026-04-10',
        description: 'Exported chat history demonstrating automated macro replies to complex mentorship questions regarding risk management.',
        redactedUrl: 'https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=800&q=80',
        status: 'Verified',
        gdriveId: '1X9y8Z7w6V5u4T3s2R_EV102',
        redactionNotes: 'PII removed: Personal handles, phone numbers, private Telegram IDs.'
      }
    ];

    const INITIAL_RESPONSES = [
      {
        id: 'RESP-001',
        relatedComplaintId: 'CMP-2026-089',
        date: '2026-04-15',
        author: '10xTrader Official Operations Team',
        status: 'Verified Authentic',
        text: 'Regarding CMP-2026-089: We acknowledge that during our high-volume enrollment week in March 2026, our VIP live mentor queue experienced technical latency. Telegram automated routing was deployed temporarily. We have contacted affected users to issue proportional 25% partial refunds and scheduled individual catch-up sessions.',
        sourceUrl: 'Official Provider Response Portal'
      }
    ];

    const COMPARISON_MATRIX = [
      {
        topic: 'Breadth of Trading Strategies',
        advertised: '12+ Proprietary Algorithmic & Institutional Order Flow Models',
        reported: 'Basic Moving Average Crossovers & standard RSI/MACD retail setups readily available free online.',
        verifiedStatus: 'Discrepancy Documented'
      },
      {
        topic: 'Live Sessions & Practical Demo',
        advertised: 'Daily 2-Hour Live Market Execution & Real-Money Portfolio Management',
        reported: 'Pre-recorded video loops played as live streams; minimal real-time trade executions.',
        verifiedStatus: 'Under Active Review'
      },
      {
        topic: 'Course Materials & Syllabus',
        advertised: 'Over 100 Hours of High-Definition Video Curriculum & Custom Software Tools',
        reported: 'Approx. 18 hours of basic introductory video lectures; custom software is a renamed open-source script.',
        verifiedStatus: 'Discrepancy Documented'
      }
    ];

    function App() {
      const [isAdminMode, setIsAdminMode] = useState(false);
      const [activeTab, setActiveTab] = useState('home');
      const [complaints, setComplaints] = useState(INITIAL_COMPLAINTS);
      const [evidenceItems, setEvidenceItems] = useState(INITIAL_EVIDENCE);
      const [responses, setResponses] = useState(INITIAL_RESPONSES);
      const [auditLog, setAuditLog] = useState([
        { id: 'LOG-1', time: '2026-04-22 10:14 IST', action: 'Approved Complaint CMP-2026-089', admin: 'Moderator_Alpha' }
      ]);

      const [searchQuery, setSearchQuery] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('All');
      const [selectedComplaintModal, setSelectedComplaintModal] = useState(null);
      const [selectedEvidenceModal, setSelectedEvidenceModal] = useState(null);
      const [showSearchModal, setShowSearchModal] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [legalModalContent, setLegalModalContent] = useState(null);

      const [toastMessage, setToastMessage] = useState(null);
      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 4000);
      };

      const [submitForm, setSubmitForm] = useState({
        relationship: 'Student',
        displayPref: 'Masked name',
        privateName: '',
        privateEmail: '',
        courseDate: '',
        title: '',
        summary: '',
        category: 'Course Content',
        rawFile: null,
        refLinks: '',
        consent: false
      });
      const [submissionSuccess, setSubmissionSuccess] = useState(false);
      const [isUploading, setIsUploading] = useState(false);

      const stats = useMemo(() => {
        const totalSubmitted = complaints.length;
        const reviewed = complaints.filter(c => c.status === 'Approved' || c.status === 'Rejected').length;
        const evidenceCount = evidenceItems.length;
        const complaintsCount = complaints.filter(c => c.status === 'Approved').length;
        const providerResponsesCount = responses.length;
        return { totalSubmitted, reviewed, evidenceCount, complaintsCount, providerResponsesCount };
      }, [complaints, evidenceItems, responses]);

      const filteredComplaints = useMemo(() => {
        return complaints.filter(c => {
          if (!isAdminMode && c.status !== 'Approved') return false;
          const matchesSearch = c.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                c.summary.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                c.id.toLowerCase().includes(searchQuery.toLowerCase());
          const matchesCat = categoryFilter === 'All' || c.category === categoryFilter;
          return matchesSearch && matchesCat;
        });
      }, [complaints, searchQuery, categoryFilter, isAdminMode]);

      const filteredEvidence = useMemo(() => {
        return evidenceItems.filter(e => {
          return e.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                 e.description.toLowerCase().includes(searchQuery.toLowerCase());
        });
      }, [evidenceItems, searchQuery]);

      // REAL FORM SUBMISSION HANDLER LINKED TO GOOGLE APPS SCRIPT & GOOGLE DRIVE
      const handleSubmission = async (e) => {
        e.preventDefault();
        if (!submitForm.consent) {
          alert("Please confirm the authorization disclosure.");
          return;
        }

        setIsUploading(true);

        try {
          let base64File = "";
          let fileName = "";
          let fileType = "";

          // Convert uploaded file to base64 if selected
          if (submitForm.rawFile) {
            fileName = submitForm.rawFile.name;
            fileType = submitForm.rawFile.type;
            base64File = await new Promise((resolve) => {
              const reader = new FileReader();
              reader.onload = (evt) => resolve(evt.target.result);
              reader.readAsDataURL(submitForm.rawFile);
            });
          }

          const payload = {
            title: submitForm.title,
            summary: submitForm.summary,
            category: submitForm.category,
            relationship: submitForm.relationship,
            displayPref: submitForm.displayPref,
            privateName: submitForm.privateName,
            privateEmail: submitForm.privateEmail,
            courseDate: submitForm.courseDate,
            fileName: fileName,
            fileType: fileType,
            fileData: base64File
          };

          // POST TO GOOGLE APPS SCRIPT ENDPOINT
          const res = await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
          });

          const result = await res.json();

          if (result.status === "success") {
            const newId = `CMP-2026-${Math.floor(100 + Math.random() * 900)}`;
            const newRecord = {
              id: newId,
              submitter: submitForm.displayPref === 'Anonymous' ? 'Anonymous' : `${submitForm.privateName.charAt(0) || 'U'}***`,
              relationship: submitForm.relationship,
              courseDate: submitForm.courseDate || 'Recent',
              dateSubmitted: new Date().toISOString().split('T')[0],
              title: submitForm.title,
              summary: submitForm.summary,
              category: submitForm.category,
              status: 'Pending',
              evidenceCount: base64File ? 1 : 0,
              evidenceRefs: [],
              providerResponseId: null,
              verifiedPurchase: false,
              privateEmail: submitForm.privateEmail,
              privateName: submitForm.privateName
            };

            setComplaints(prev => [newRecord, ...prev]);
            setSubmissionSuccess(true);
            triggerToast("Submission saved & file uploaded to Google Drive!");
          } else {
            alert("Upload error: " + result.message);
          }
        } catch (err) {
          alert("Submission error. Please check your network connection.");
        } finally {
          setIsUploading(false);
        }
      };

      const handleApproveComplaint = (id) => {
        setComplaints(prev => prev.map(c => c.id === id ? { ...c, status: 'Approved' } : c));
        setAuditLog(prev => [{ id: `LOG-${Date.now()}`, time: new Date().toLocaleString(), action: `Approved submission ${id}`, admin: 'Admin_Super' }, ...prev]);
        triggerToast(`Record ${id} published.`);
      };

      const handleRejectComplaint = (id) => {
        setComplaints(prev => prev.map(c => c.id === id ? { ...c, status: 'Rejected' } : c));
        setAuditLog(prev => [{ id: `LOG-${Date.now()}`, time: new Date().toLocaleString(), action: `Rejected submission ${id}`, admin: 'Admin_Super' }, ...prev]);
        triggerToast(`Record ${id} rejected.`);
      };

      return (
        <div className="min-h-screen bg-[#07090e] text-slate-200 font-sans flex flex-col relative overflow-x-hidden">
          
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 border border-emerald-500/50 text-emerald-400 px-5 py-3 rounded-lg shadow-2xl flex items-center gap-3">
              <span className="text-sm font-medium">{toastMessage}</span>
            </div>
          )}

          {/* HEADER */}
          <header className="sticky top-0 z-40 bg-[#0a0d14]/90 backdrop-blur-md border-b border-slate-800/80">
            <div className="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('home')}>
                <div className="w-10 h-10 rounded-lg bg-gradient-to-br from-red-600 to-red-900 flex items-center justify-center border border-red-500/30">
                  <span className="font-extrabold text-white text-lg">10x</span>
                </div>
                <div>
                  <span className="text-xl font-extrabold text-white uppercase font-mono">10xTrader<span className="text-red-500">Watch</span></span>
                  <p className="text-xs text-slate-400">Real traders. Real stories.</p>
                </div>
              </div>

              <nav className="hidden lg:flex items-center gap-2 text-sm font-medium">
                {[
                  { id: 'home', label: 'Home' },
                  { id: 'what-we-found', label: 'What We Found' },
                  { id: 'complaints', label: 'Complaints' },
                  { id: 'evidence', label: 'Evidence' },
                  { id: 'responses', label: 'Responses' },
                  { id: 'submit', label: 'Submit Evidence' },
                  { id: 'about', label: 'About' }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`px-3 py-2 rounded-md transition ${
                      activeTab === item.id ? 'text-white bg-slate-800 border border-slate-700' : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    {item.label}
                  </button>
                ))}
              </nav>

              <div className="flex items-center gap-2 bg-slate-900 border border-slate-800 rounded-lg p-1 text-xs">
                <button onClick={() => setIsAdminMode(false)} className={`px-2.5 py-1 rounded ${!isAdminMode ? 'bg-red-600 text-white' : 'text-slate-400'}`}>Public</button>
                <button onClick={() => { setIsAdminMode(true); setActiveTab('admin'); }} className={`px-2.5 py-1 rounded ${isAdminMode ? 'bg-cyan-600 text-white' : 'text-slate-400'}`}>Admin</button>
              </div>
            </div>
          </header>

          <main className="flex-1">

            {/* HERO SECTION */}
            {activeTab === 'home' && (
              <div>
                <section className="relative pt-16 pb-24 px-4 max-w-7xl mx-auto">
                  <span className="inline-block px-3 py-1 rounded-full bg-red-950 border border-red-800 text-red-400 text-xs font-mono mb-4">
                    Independent Consumer Awareness Platform
                  </span>
                  <h1 className="text-4xl sm:text-6xl font-extrabold text-white">
                    The Truth Behind <span className="text-red-500">10xTrader</span>
                  </h1>
                  <p className="mt-4 text-xl text-slate-300">Big promises. High fees. Make informed decisions.</p>
                  <p className="mt-4 text-slate-400 max-w-2xl">
                    Explore submitted student experiences, course materials, and supporting evidence to help prospective students ask better questions before paying for a trading course.
                  </p>
                  <div className="mt-8 flex gap-4">
                    <button onClick={() => setActiveTab('evidence')} className="px-6 py-3 rounded-lg bg-red-600 text-white font-semibold hover:bg-red-500">Explore Evidence</button>
                    <button onClick={() => setActiveTab('submit')} className="px-6 py-3 rounded-lg bg-slate-900 border border-slate-700 text-slate-200 hover:bg-slate-800">Submit Experience</button>
                  </div>
                </section>

                {/* STATS STRIP */}
                <section className="bg-slate-900/60 border-y border-slate-800 py-8 px-4">
                  <div className="max-w-7xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                    <div className="p-4 bg-slate-900 rounded-xl border border-slate-800">
                      <div className="text-2xl font-bold text-white font-mono">{stats.totalSubmitted}</div>
                      <div className="text-xs text-slate-400 mt-1">Submitted Entries</div>
                    </div>
                    <div className="p-4 bg-slate-900 rounded-xl border border-slate-800">
                      <div className="text-2xl font-bold text-cyan-400 font-mono">{stats.reviewed}</div>
                      <div className="text-xs text-slate-400 mt-1">Reviewed Accounts</div>
                    </div>
                    <div className="p-4 bg-slate-900 rounded-xl border border-slate-800">
                      <div className="text-2xl font-bold text-emerald-400 font-mono">{stats.evidenceCount}</div>
                      <div className="text-xs text-slate-400 mt-1">Evidence Files</div>
                    </div>
                    <div className="p-4 bg-slate-900 rounded-xl border border-slate-800">
                      <div className="text-2xl font-bold text-red-400 font-mono">{stats.complaintsCount}</div>
                      <div className="text-xs text-slate-400 mt-1">Published Complaints</div>
                    </div>
                  </div>
                </section>
              </div>
            )}

            {/* SUBMIT EVIDENCE FORM PAGE */}
            {activeTab === 'submit' && (
              <div className="max-w-2xl mx-auto px-4 py-12">
                <h1 className="text-3xl font-bold text-white mb-2">Submit Your Experience</h1>
                <p className="text-slate-400 text-sm mb-8">Files attached below upload directly to your private Google Drive folder.</p>

                {submissionSuccess ? (
                  <div className="bg-slate-900 border border-emerald-500/50 p-8 rounded-xl text-center">
                    <h2 className="text-2xl font-bold text-emerald-400 mb-2">Upload Complete</h2>
                    <p className="text-slate-300 text-sm mb-6">Your evidence file and submission details have been saved directly to your Google Drive.</p>
                    <button onClick={() => setSubmissionSuccess(false)} className="px-6 py-2 bg-slate-800 text-white rounded-lg text-sm">Submit Another</button>
                  </div>
                ) : (
                  <form onSubmit={handleSubmission} className="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4">
                    <div>
                      <label className="block text-xs font-mono text-slate-400 mb-1">Relationship to Course *</label>
                      <select value={submitForm.relationship} onChange={e => setSubmitForm({...submitForm, relationship: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-sm text-white">
                        <option value="Student">Former / Active Student</option>
                        <option value="Course provider or team">Course Provider</option>
                        <option value="Other">Other</option>
                      </select>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1">Full Name (Confidential) *</label>
                        <input type="text" required value={submitForm.privateName} onChange={e => setSubmitForm({...submitForm, privateName: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-sm text-white" />
                      </div>
                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1">Email (Confidential) *</label>
                        <input type="email" required value={submitForm.privateEmail} onChange={e => setSubmitForm({...submitForm, privateEmail: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-sm text-white" />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-mono text-slate-400 mb-1">Experience Title *</label>
                      <input type="text" required value={submitForm.title} onChange={e => setSubmitForm({...submitForm, title: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-sm text-white" />
                    </div>

                    <div>
                      <label className="block text-xs font-mono text-slate-400 mb-1">Detailed Account *</label>
                      <textarea rows={4} required value={submitForm.summary} onChange={e => setSubmitForm({...submitForm, summary: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-sm text-white"></textarea>
                    </div>

                    <div>
                      <label className="block text-xs font-mono text-slate-400 mb-1">Upload Screenshot / Evidence File (Google Drive)</label>
                      <input type="file" onChange={e => setSubmitForm({...submitForm, rawFile: e.target.files[0]})} className="text-xs text-slate-400" />
                    </div>

                    <div className="flex items-start gap-2 pt-2">
                      <input type="checkbox" id="c" checked={submitForm.consent} onChange={e => setSubmitForm({...submitForm, consent: e.target.checked})} />
                      <label htmlFor="c" className="text-xs text-slate-400">I confirm that this experience is accurate and true.</label>
                    </div>

                    <button type="submit" disabled={isUploading} className="w-full py-3 bg-red-600 hover:bg-red-500 text-white font-bold rounded-lg transition">
                      {isUploading ? "Uploading to Google Drive..." : "Submit Evidence"}
                    </button>
                  </form>
                )}
              </div>
            )}

            {/* COMPLAINTS DIRECTORY */}
            {activeTab === 'complaints' && (
              <div className="max-w-7xl mx-auto px-4 py-12">
                <h1 className="text-3xl font-bold text-white mb-6">Student Complaints Directory</h1>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {filteredComplaints.map(item => (
                    <div key={item.id} className="bg-slate-900 border border-slate-800 p-6 rounded-xl">
                      <div className="flex justify-between text-xs text-slate-500 font-mono mb-2">
                        <span>{item.id}</span>
                        <span>{item.dateSubmitted}</span>
                      </div>
                      <h3 className="text-lg font-bold text-white mb-2">{item.title}</h3>
                      <p className="text-sm text-slate-300">{item.summary}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* ADMIN DASHBOARD */}
            {activeTab === 'admin' && (
              <div className="max-w-7xl mx-auto px-4 py-12">
                <h1 className="text-2xl font-bold text-cyan-400 mb-6">Moderator Admin Portal</h1>
                <div className="space-y-4">
                  {complaints.filter(c => c.status === 'Pending').map(item => (
                    <div key={item.id} className="bg-slate-900 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                      <div>
                        <span className="text-xs text-amber-400 font-mono">{item.id} (Pending)</span>
                        <h4 className="font-bold text-white">{item.title}</h4>
                      </div>
                      <div className="flex gap-2">
                        <button onClick={() => handleApproveComplaint(item.id)} className="px-3 py-1 bg-emerald-600 text-white rounded text-xs">Approve</button>
                        <button onClick={() => handleRejectComplaint(item.id)} className="px-3 py-1 bg-red-900 text-red-300 rounded text-xs">Reject</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>

          <footer className="bg-[#05070a] border-t border-slate-800 py-8 px-4 text-center text-xs text-slate-500 font-mono">
            © 2026 10xTrader Watch. Independent Consumer Research Platform.
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
