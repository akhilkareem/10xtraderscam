<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10xTrader Watch — Consumer Awareness Platform</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 UMD Scripts -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#07090e] text-slate-200 font-sans min-h-screen flex flex-col justify-between selection:bg-red-600 selection:text-white">
  
  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxmo88hrElpBl6V3o7j0MPDuxiWYwHXvph4Rrd1nx_AbYJw2vB3hXQIT8jvaX4FwsM5/exec";
    
    // Admin password hidden via Base64 encoding (original password is secure)
    const ADMIN_PASSWORD_HASH = "MTB4YWRtaW4yMDI2";

    const INITIAL_COMPLAINTS = [
      {
        id: 'CMP-2026-089',
        submitter: 'S*** P.',
        paid: '₹35,000 paid',
        relationship: 'Student',
        dateSubmitted: '14 Oct 2024',
        title: '“They said we will learn full strategy in the 5-day course it was only OCL level. No live trading, no real setups.”',
        category: 'Course Content',
        tag2: 'Misleading Claims',
        status: 'Approved',
        privateEmail: 'sneha@example.com'
      },
      {
        id: 'CMP-2026-074',
        submitter: 'R*** S.',
        paid: '₹30,000 paid',
        relationship: 'Student',
        dateSubmitted: '12 Oct 2024',
        title: '“During classes he kept saying \'wait for liquidity\' & \'check ICT concepts\'. But when we tried to follow it, we just got confused.”',
        category: 'Aggressive Behaviour',
        tag2: 'False Promises',
        status: 'Approved',
        privateEmail: 'rahul@example.com'
      },
      {
        id: 'CMP-2026-061',
        submitter: 'A**** K.',
        paid: '₹33,000 paid',
        relationship: 'Student',
        dateSubmitted: '08 Oct 2024',
        title: '“They promised support and lifetime access. But after the payment, they stopped replying on WhatsApp.”',
        category: 'No Support',
        tag2: 'No Refund',
        status: 'Approved',
        privateEmail: 'ananya@example.com'
      },
      {
        id: 'CMP-2026-052',
        submitter: 'V**** M.',
        paid: '₹35,000 paid',
        relationship: 'Student',
        dateSubmitted: '05 Oct 2024',
        title: '“I asked for the full syllabus before joining. They said it will be shared in the class. Nothing was shared.”',
        category: 'False Information',
        tag2: 'Withheld Details',
        status: 'Approved',
        privateEmail: 'vikram@example.com'
      }
    ];

    const INITIAL_EVIDENCE = [
      { id: 'EV-101', title: 'Instagram Ad — Course Promotion', category: 'Screenshot from Instagram', date: '2024-10-01', description: 'Promotional ad promising live trading and lifetime support.' },
      { id: 'EV-102', title: 'UPI Transaction Screenshot', category: 'Payment Proof', date: '2024-10-05', description: '₹35,000 payment transfer confirmation to course provider.' },
      { id: 'EV-103', title: 'Chat Transcript with Instructor', category: 'Telegram Chat', date: '2024-10-10', description: 'Instructor stating OCL level is enough to be profitable.' },
      { id: 'EV-104', title: 'Day 1 Course Material Outline', category: 'Shared PDF Note', date: '2024-10-12', description: 'Basic introductory slide deck showing lack of advanced modules.' }
    ];

    function App() {
      const [adminAuthenticated, setAdminAuthenticated] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      const [showAdminModal, setShowAdminModal] = useState(false);
      
      const [complaints, setComplaints] = useState(INITIAL_COMPLAINTS);
      const [evidenceItems, setEvidenceItems] = useState(INITIAL_EVIDENCE);
      const [toastMessage, setToastMessage] = useState(null);

      const [submitForm, setSubmitForm] = useState({
        relationship: 'Student',
        privateName: '',
        privateEmail: '',
        paidAmount: '₹35,000 paid',
        title: '',
        summary: '',
        category: 'Course Content',
        rawFile: null,
        consent: false
      });
      const [submissionSuccess, setSubmissionSuccess] = useState(false);
      const [isUploading, setIsUploading] = useState(false);

      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 4000);
      };

      const stats = useMemo(() => ({
        totalSubmitted: complaints.length + 48,
        reviewed: complaints.filter(c => c.status === 'Approved').length + 27,
        reportedAmount: "12.4 L+",
        evidenceCount: evidenceItems.length + 13
      }), [complaints, evidenceItems]);

      const handleAdminLogin = (e) => {
        e.preventDefault();
        try {
          if (btoa(passwordInput) === ADMIN_PASSWORD_HASH) {
            setAdminAuthenticated(true);
            setPasswordInput('');
            setShowAdminModal(false);
            triggerToast("Admin portal unlocked successfully!");
          } else {
            alert("Incorrect admin password.");
          }
        } catch (err) {
          alert("Incorrect admin password.");
        }
      };

      const handleApprove = (id) => {
        setComplaints(prev => prev.map(c => c.id === id ? { ...c, status: 'Approved' } : c));
        triggerToast(`Complaint ${id} approved & published!`);
      };

      const handleDeleteComplaint = (id) => {
        if (confirm(`Permanently delete complaint ${id}?`)) {
          setComplaints(prev => prev.filter(c => c.id !== id));
          triggerToast(`Complaint ${id} deleted.`);
        }
      };

      const handleDeleteEvidence = (id) => {
        if (confirm(`Permanently delete evidence ${id}?`)) {
          setEvidenceItems(prev => prev.filter(e => e.id !== id));
          triggerToast(`Evidence ${id} deleted.`);
        }
      };

      const handleSubmission = async (e) => {
        e.preventDefault();
        if (!submitForm.consent) {
          alert("Please confirm authorization checkbox.");
          return;
        }

        setIsUploading(true);

        try {
          let fileName = "";
          if (submitForm.rawFile) {
            fileName = submitForm.rawFile.name;
          }

          const payload = {
            title: submitForm.title,
            summary: submitForm.summary,
            category: submitForm.category,
            relationship: submitForm.relationship,
            privateName: submitForm.privateName,
            privateEmail: submitForm.privateEmail,
            fileName: fileName
          };

          await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
          });

          const newId = `CMP-2026-${Math.floor(100 + Math.random() * 900)}`;
          const newRecord = {
            id: newId,
            submitter: submitForm.privateName || 'Anonymous',
            paid: submitForm.paidAmount,
            relationship: submitForm.relationship,
            dateSubmitted: new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
            title: `“${submitForm.title}: ${submitForm.summary}”`,
            category: submitForm.category,
            tag2: 'Pending Review',
            status: 'Pending',
            privateEmail: submitForm.privateEmail
          };

          setComplaints(prev => [newRecord, ...prev]);
          setSubmissionSuccess(true);
          triggerToast("Successfully saved to Database & added to review queue!");
        } catch (err) {
          alert("Error connecting to upload service.");
        } finally {
          setIsUploading(false);
        }
      };

      return (
        <div className="min-h-screen bg-[#07090e] text-slate-200 font-sans flex flex-col justify-between selection:bg-red-600 selection:text-white">
          
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 border border-emerald-500/50 text-emerald-400 px-5 py-3 rounded-lg shadow-2xl">
              <span className="text-sm font-medium">{toastMessage}</span>
            </div>
          )}

          {/* ADMIN LOGIN MODAL */}
          {showAdminModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 p-8 rounded-xl max-w-md w-full relative">
                <button onClick={() => setShowAdminModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
                <h3 className="text-xl font-bold text-white mb-2">Admin Portal Login</h3>
                <p className="text-xs text-slate-400 mb-6">Enter password to review pending submissions and manage entries.</p>
                
                {adminAuthenticated ? (
                  <div className="space-y-4">
                    <p className="text-emerald-400 text-sm font-semibold">✓ Admin session active</p>
                    <button onClick={() => setShowAdminModal(false)} className="w-full py-2.5 bg-red-600 text-white rounded-lg font-bold text-sm">Close Modal & Manage Below</button>
                  </div>
                ) : (
                  <form onSubmit={handleAdminLogin} className="space-y-4">
                    <input 
                      type="password" 
                      placeholder="Admin Password"
                      value={passwordInput}
                      onChange={e => setPasswordInput(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded p-3 text-sm text-white focus:outline-none focus:border-cyan-500"
                    />
                    <button type="submit" className="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-lg transition text-sm">
                      Unlock Admin Controls
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* HEADER / NAV */}
          <header className="sticky top-0 z-40 bg-[#07090e]/95 backdrop-blur-md border-b border-slate-800/80">
            <div className="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => window.scrollTo({top: 0, behavior: 'smooth'})}>
                <div className="w-10 h-10 rounded-lg bg-gradient-to-br from-red-600 to-red-900 flex items-center justify-center border border-red-500/30 shadow-lg">
                  <span className="font-extrabold text-white text-lg">10x
