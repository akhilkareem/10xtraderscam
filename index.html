<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10xTrader Watch — Consumer Awareness Platform</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 UMD Scripts -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#07090e] text-slate-200 font-sans min-h-screen flex flex-col">
  
  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxmo88hrElpBl6V3o7j0MPDuxiWYwHXvph4Rrd1nx_AbYJw2vB3hXQIT8jvaX4FwsM5/exec";

    const INITIAL_COMPLAINTS = [
      {
        id: 'CMP-2026-089',
        submitter: 'M*** K.',
        relationship: 'Student',
        courseDate: 'March 2026',
        dateSubmitted: '2026-04-12',
        title: 'Promised 1-on-1 Mentorship Was Automated Bot Messages',
        summary: 'The VIP enrollment package ($4,999) explicitly advertised daily personalized live coaching and trade reviews by the master trader. In reality, all direct support was handled by an unmonitored automated Telegram bot sending recycled chart signals from 2023.',
        category: 'Misleading Claims',
        status: 'Approved'
      },
      {
        id: 'CMP-2026-074',
        submitter: 'Anonymous',
        relationship: 'Student',
        courseDate: 'January 2026',
        dateSubmitted: '2026-03-28',
        title: 'Refund Policy Denied After 48 Hours Despite 30-Day Guarantee',
        summary: 'The promotional page offered a "No-Questions-Asked 30-Day Refund Policy". When requested on day 5 due to missing module materials, support claimed that viewing >10% of video content rendered the account non-refundable according to hidden terms.',
        category: 'Refund Policy',
        status: 'Approved'
      }
    ];

    const INITIAL_EVIDENCE = [
      { id: 'EV-101', title: 'Refund Policy Sales Page Screenshot', category: 'Course Advertisements', date: '2026-03-29', description: 'Promotional landing page displaying bold "30-Day Guarantee" text.', status: 'Verified' },
      { id: 'EV-102', title: 'Telegram Support Log Transcript', category: 'Chat Excerpts', date: '2026-04-10', description: 'Exported chat history demonstrating automated macro replies.', status: 'Verified' }
    ];

    const INITIAL_RESPONSES = [
      { id: 'RESP-001', relatedComplaintId: 'CMP-2026-089', date: '2026-04-15', author: '10xTrader Official Operations Team', status: 'Verified Authentic', text: 'We acknowledge that during our high-volume enrollment week our VIP queue experienced latency. We have contacted affected users for partial refunds.' }
    ];

    function App() {
      const [isAdminMode, setIsAdminMode] = useState(false);
      const [activeTab, setActiveTab] = useState('home');
      const [complaints, setComplaints] = useState(INITIAL_COMPLAINTS);
      const [evidenceItems, setEvidenceItems] = useState(INITIAL_EVIDENCE);
      const [responses, setResponses] = useState(INITIAL_RESPONSES);
      const [toastMessage, setToastMessage] = useState(null);

      const [submitForm, setSubmitForm] = useState({
        relationship: 'Student',
        displayPref: 'Masked name',
        privateName: '',
        privateEmail: '',
        title: '',
        summary: '',
        category: 'Course Content',
        consent: false
      });
      const [submissionSuccess, setSubmissionSuccess] = useState(false);
      const [isUploading, setIsUploading] = useState(false);

      const stats = useMemo(() => ({
        totalSubmitted: complaints.length,
        reviewed: complaints.filter(c => c.status === 'Approved').length,
        evidenceCount: evidenceItems.length,
        complaintsCount: complaints.filter(c => c.status === 'Approved').length
      }), [complaints, evidenceItems]);

      const handleSubmission = async (e) => {
        e.preventDefault();
        if (!submitForm.consent) {
          alert("Please confirm authorization.");
          return;
        }

        setIsUploading(true);

        try {
          const formData = new URLSearchParams();
          formData.append("title", submitForm.title);
          formData.append("summary", submitForm.summary);
          formData.append("category", submitForm.category);
          formData.append("relationship", submitForm.relationship);
          formData.append("privateName", submitForm.privateName);
          formData.append("privateEmail", submitForm.privateEmail);

          await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData.toString()
          });

          const newId = `CMP-2026-${Math.floor(100 + Math.random() * 900)}`;
          setComplaints(prev => [{
            id: newId,
            submitter: submitForm.displayPref === 'Anonymous' ? 'Anonymous' : `${submitForm.privateName.charAt(0) || 'U'}***`,
            relationship: submitForm.relationship,
            courseDate: 'Recent',
            dateSubmitted: new Date().toISOString().split('T')[0],
            title: submitForm.title,
            summary: submitForm.summary,
            category: submitForm.category,
            status: 'Pending'
          }, ...prev]);

          setSubmissionSuccess(true);
          setToastMessage("Successfully saved Database!");
          setTimeout(() => setToastMessage(null), 4000);
        } catch (err) {
          alert("Submission error. Check network connection.");
        } finally {
          setIsUploading(false);
        }
      };

      return (
        <div className="min-h-screen bg-[#07090e] text-slate-200 flex flex-col justify-between">
          
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 border border-emerald-500/50 text-emerald-400 px-5 py-3 rounded-lg shadow-2xl">
              <span className="text-sm font-medium">{toastMessage}</span>
            </div>
          )}

          {/* HEADER */}
          <header className="sticky top-0 z-40 bg-[#0a0d14]/90 backdrop-blur-md border-b border-slate-800">
            <div className="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('home')}>
                <div className="w-10 h-10 rounded-lg bg-gradient-to-br from-red-600 to-red-900 flex items-center justify-center border border-red-500/30">
                  <span className="font-extrabold text-white text-lg">10x</span>
                </div>
                <div>
                  <span className="text-xl font-extrabold text-white uppercase font-mono">10xTrader<span className="text-red-500">Watch</span></span>
                  <p className="text-xs text-slate-400">Real traders. Real stories.</p>
                </div>
              </div>

              <nav className="hidden lg:flex items-center gap-1 text-sm font-medium">
                {[
                  { id: 'home', label: 'Home' },
                  { id: 'what-we-found', label: 'What We Found' },
                  { id: 'complaints', label: 'Complaints' },
                  { id: 'evidence', label: 'Evidence Gallery' },
                  { id: 'responses', label: 'Provider Responses' },
                  { id: 'submit', label: 'Submit Evidence' },
                  { id: 'about', label: 'About' }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => { setActiveTab(item.id); setSubmissionSuccess(false); }}
                    className={`px-3 py-2 rounded-md transition ${
                      activeTab === item.id ? 'text-white bg-slate-800 border border-slate-700' : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    {item.label}
                  </button>
                ))}
              </nav>

              <div className="flex items-center gap-2 bg-slate-900 border border-slate-800 rounded-lg p-1 text-xs">
                <button onClick={() => setIsAdminMode(false)} className={`px-2.5 py-1 rounded ${!isAdminMode ? 'bg-red-600 text-white' : 'text-slate-400'}`}>Public</button>
                <button onClick={() => { setIsAdminMode(true); setActiveTab('admin'); }} className={`px-2.5 py-1 rounded ${isAdminMode ? 'bg-cyan-600 text-white' : 'text-slate-400'}`}>Admin</button>
              </div>
            </div>
          </header>

          <main className="flex-1 pb-16">

            {/* HOME VIEW */}
            {activeTab === 'home' && (
              <div>
                <section className="pt-16 pb-16 px-4 max-w-7xl mx-auto">
                  <span className="inline-block px-3 py-1 rounded-full bg-red-950 border border-red-800 text-red-400 text-xs font-mono mb-4">
                    Independent Consumer Awareness Platform
                  </span>
                  <h1 className="text-4xl sm:text-6xl font-extrabold text-white">
                    The Truth Behind <span className="text-red-500">10xTrader</span>
                  </h1>
                  <p className="mt-4 text-xl text-slate-300">Big promises. High fees. Make informed decisions.</p>
                  <p className="mt-4 text-slate-400 max-w-2xl">
                    Explore submitted student experiences, course materials, and supporting evidence to help prospective students ask better questions before paying for a trading course.
                  </p>
                  <div className="mt-8 flex flex-wrap gap-4">
                    <button onClick={() => setActiveTab('complaints')} className="px-6 py-3 rounded-lg bg-red-600 text-white font-semibold hover:bg-red-500">View Complaints</button>
                    <button onClick={() => setActiveTab('submit')} className="px-6 py-3 rounded-lg bg-slate-900 border border-slate-700 text-slate-200 hover:bg-slate-800">Submit Experience</button>
                  </div>
                </section>

                {/* STATS STRIP */}
                <section className="bg-slate-900/80 border-y border-slate-800 py-8 px-4 mb-12">
                  <div className="max-w-7xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                    <div className="p-4 bg-slate-950 rounded-xl border border-slate-800">
                      <div className="text-2xl font-bold text-white font-mono">{stats.totalSubmitted}</div>
                      <div className="text-xs text-slate-400 mt-1">Submitted Accounts</div>
                    </div>
                    <div className="p-4 bg-slate-950 rounded-xl border border-slate-800">
                      <div className="text-2xl font-bold text-cyan-400 font-mono">{stats.reviewed}</div>
                      <div className="text-xs text-slate-400 mt-1">Reviewed Entries</div>
                    </div>
                    <div className="p-4 bg-slate-950 rounded-xl border border-slate-800">
                      <div className="text-2xl font-bold text-emerald-400 font-mono">{stats.evidenceCount}</div>
                      <div className="text-xs text-slate-400 mt-1">Evidence Files</div>
                    </div>
                    <div className="p-4 bg-slate-950 rounded-xl border border-slate-800">
                      <div className="text-2xl font-bold text-red-400 font-mono">{stats.complaintsCount}</div>
                      <div className="text-xs text-slate-400 mt-1">Published Complaints</div>
                    </div>
                  </div>
                </section>

                {/* EDITORIAL TEASER */}
                <section className="max-w-7xl mx-auto px-4">
                  <h2 className="text-2xl font-bold text-white mb-4">What We Found: Advertised vs Reality</h2>
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-4">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div className="bg-emerald-950/20 border border-emerald-900/40 p-4 rounded-lg">
                        <h4 className="font-bold text-emerald-400 text-sm mb-1">What Course Advertised</h4>
                        <p className="text-xs text-slate-300">12+ Proprietary Algorithmic Models, 1-on-1 daily mentorship, and 30-day unconditional refunds.</p>
                      </div>
                      <div className="bg-red-950/20 border border-red-900/40 p-4 rounded-lg">
                        <h4 className="font-bold text-red-400 text-sm mb-1">What Students Reported</h4>
                        <p className="text-xs text-slate-300">Automated Telegram bot replies, recycled retail indicators, and rejected refund requests.</p>
                      </div>
                    </div>
                    <button onClick={() => setActiveTab('what-we-found')} className="text-xs text-red-400 hover:underline font-semibold block pt-2">Read Full Investigation Matrix →</button>
                  </div>
                </section>
              </div>
            )}

            {/* WHAT WE FOUND TAB */}
            {activeTab === 'what-we-found' && (
              <div className="max-w-7xl mx-auto px-4 py-12">
                <h1 className="text-3xl font-bold text-white mb-2">Investigation Report Matrix</h1>
                <p className="text-slate-400 text-sm mb-8">Detailed comparison of marketing claims versus verified student reports.</p>
                <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
                  <table className="w-full text-left text-sm text-slate-300">
                    <thead className="bg-slate-950 text-slate-400 font-mono text-xs uppercase border-b border-slate-800">
                      <tr>
                        <th className="p-4">Category</th>
                        <th className="p-4 text-emerald-400">Promotional Claim</th>
                        <th className="p-4 text-red-400">Student Reports</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800">
                      <tr>
                        <td className="p-4 font-bold text-white">Mentorship Support</td>
                        <td className="p-4 bg-emerald-950/10">Daily 1-on-1 live coaching by master trader.</td>
                        <td className="p-4 bg-red-950/10">Unmonitored automated Telegram bot messages.</td>
                      </tr>
                      <tr>
                        <td className="p-4 font-bold text-white">Refund Guarantee</td>
                        <td className="p-4 bg-emerald-950/10">30-day no-questions-asked money-back guarantee.</td>
                        <td className="p-4 bg-red-950/10">Refunds denied if video viewing exceeds 10%.</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* COMPLAINTS TAB */}
            {activeTab === 'complaints' && (
              <div className="max-w-7xl mx-auto px-4 py-12">
                <h1 className="text-3xl font-bold text-white mb-6">Student Complaints Directory</h1>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {complaints.filter(c => isAdminMode || c.status === 'Approved').map(item => (
                    <div key={item.id} className="bg-slate-900 border border-slate-800 p-6 rounded-xl">
                      <div className="flex justify-between text-xs text-slate-500 font-mono mb-2">
                        <span>{item.id}</span>
                        <span>{item.dateSubmitted}</span>
                      </div>
                      <h3 className="text-lg font-bold text-white mb-2">{item.title}</h3>
                      <p className="text-sm text-slate-300">{item.summary}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* EVIDENCE GALLERY TAB */}
            {activeTab === 'evidence' && (
              <div className="max-w-7xl mx-auto px-4 py-12">
                <h1 className="text-3xl font-bold text-white mb-2">Redacted Evidence Gallery</h1>
                <p className="text-slate-400 text-sm mb-8">Archived specimens with PII redacted for privacy.</p>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {evidenceItems.map(item => (
                    <div key={item.id} className="bg-slate-900 border border-slate-800 p-6 rounded-xl">
                      <span className="text-xs font-mono text-cyan-400">{item.id} • {item.category}</span>
                      <h3 className="text-lg font-bold text-white mt-1 mb-2">{item.title}</h3>
                      <p className="text-xs text-slate-300">{item.description}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* PROVIDER RESPONSES TAB */}
            {activeTab === 'responses' && (
              <div className="max-w-7xl mx-auto px-4 py-12">
                <h1 className="text-3xl font-bold text-white mb-2">Provider Responses (Right of Reply)</h1>
                <p className="text-slate-400 text-sm mb-8">Authenticated statements issued by course leadership.</p>
                <div className="space-y-4">
                  {responses.map(resp => (
                    <div key={resp.id} className="bg-slate-900 border border-amber-900/40 p-6 rounded-xl">
                      <span className="text-xs font-mono text-amber-400 bg-amber-950 px-2 py-0.5 rounded">{resp.status}</span>
                      <h3 className="text-lg font-bold text-white mt-2 mb-1">{resp.author}</h3>
                      <p className="text-sm text-slate-300">{resp.text}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* SUBMIT EVIDENCE TAB */}
            {activeTab === 'submit' && (
              <div className="max-w-2xl mx-auto px-4 py-12">
                <h1 className="text-3xl font-bold text-white mb-2">Submit Your Experience</h1>
                <p className="text-slate-400 text-sm mb-8">Submissions route directly to your private Database folder.</p>

                {submissionSuccess ? (
                  <div className="bg-slate-900 border border-emerald-500/50 p-8 rounded-xl text-center">
                    <h2 className="text-2xl font-bold text-emerald-400 mb-2">Submission Received</h2>
                    <p className="text-slate-300 text-sm mb-6">Your data has been securely saved to Database.</p>
                    <button onClick={() => setSubmissionSuccess(false)} className="px-6 py-2 bg-slate-800 text-white rounded-lg text-sm">Submit Another</button>
                  </div>
                ) : (
                  <form onSubmit={handleSubmission} className="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4">
                    <div>
                      <label className="block text-xs font-mono text-slate-400 mb-1">Relationship to Course *</label>
                      <select value={submitForm.relationship} onChange={e => setSubmitForm({...submitForm, relationship: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-sm text-white">
                        <option value="Student">Former / Active Student</option>
                        <option value="Course provider or team">Course Provider</option>
                        <option value="Other">Other</option>
                      </select>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1">Full Name (Confidential) *</label>
                        <input type="text" required value={submitForm.privateName} onChange={e => setSubmitForm({...submitForm, privateName: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-sm text-white" />
                      </div>
                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1">Email (Confidential) *</label>
                        <input type="email" required value={submitForm.privateEmail} onChange={e => setSubmitForm({...submitForm, privateEmail: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-sm text-white" />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-mono text-slate-400 mb-1">Experience Title *</label>
                      <input type="text" required value={submitForm.title} onChange={e => setSubmitForm({...submitForm, title: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-sm text-white" />
                    </div>

                    <div>
                      <label className="block text-xs font-mono text-slate-400 mb-1">Detailed Account *</label>
                      <textarea rows={4} required value={submitForm.summary} onChange={e => setSubmitForm({...submitForm, summary: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-sm text-white"></textarea>
                    </div>

                    <div className="flex items-start gap-2 pt-2">
                      <input type="checkbox" id="c" checked={submitForm.consent} onChange={e => setSubmitForm({...submitForm, consent: e.target.checked})} className="mt-1" />
                      <label htmlFor="c" className="text-xs text-slate-400">I confirm that this experience is accurate and true.</label>
                    </div>

                    <button type="submit" disabled={isUploading} className="w-full py-3 bg-red-600 hover:bg-red-500 text-white font-bold rounded-lg transition">
                      {isUploading ? "Uploading to Database..." : "Submit Evidence"}
                    </button>
                  </form>
                )}
              </div>
            )}

            {/* ABOUT TAB */}
            {activeTab === 'about' && (
              <div className="max-w-3xl mx-auto px-4 py-12">
                <h1 className="text-3xl font-bold text-white mb-6">About 10xTrader Watch</h1>
                <div className="bg-slate-900 border border-slate-800 p-8 rounded-xl space-y-4 text-sm text-slate-300">
                  <p><strong>10xTrader Watch</strong> is an independent consumer awareness platform dedicated to bringing transparency to retail trading education courses.</p>
                  <p>All submissions are manually reviewed by moderators, and personal credentials are kept confidential in private Database storage buckets.</p>
                </div>
              </div>
            )}

            {/* ADMIN DASHBOARD TAB */}
            {activeTab === 'admin' && (
              <div className="max-w-7xl mx-auto px-4 py-12">
                <h1 className="text-2xl font-bold text-cyan-400 mb-6">Moderator Admin Portal</h1>
                <div className="space-y-4">
                  {complaints.filter(c => c.status === 'Pending').length === 0 ? (
                    <p className="text-slate-500 text-sm">No pending submissions.</p>
                  ) : (
                    complaints.filter(c => c.status === 'Pending').map(item => (
                      <div key={item.id} className="bg-slate-900 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                        <div>
                          <span className="text-xs text-amber-400 font-mono">{item.id} (Pending)</span>
                          <h4 className="font-bold text-white">{item.title}</h4>
                        </div>
                        <div className="flex gap-2">
                          <button onClick={() => setComplaints(prev => prev.map(c => c.id === item.id ? {...c, status: 'Approved'} : c))} className="px-3 py-1 bg-emerald-600 text-white rounded text-xs">Approve</button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

          </main>

          <footer className="bg-[#05070a] border-t border-slate-800 py-8 px-4 text-center text-xs text-slate-500 font-mono">
            © 2026 10xTrader Watch. Independent Consumer Research Platform.
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
