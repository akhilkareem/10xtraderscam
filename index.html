  const [isUploading, setIsUploading] = useState(false);

  const stats = useMemo(() => {
    const totalSubmitted = complaints.length;
    const reviewed = complaints.filter(c => c.status === 'Approved' || c.status === 'Rejected').length;
    const evidenceCount = evidenceItems.length;
    const complaintsCount = complaints.filter(c => c.status === 'Approved').length;
    const providerResponsesCount = responses.length;
    return { totalSubmitted, reviewed, evidenceCount, complaintsCount, providerResponsesCount };
  }, [complaints, evidenceItems, responses]);

  const filteredComplaints = useMemo(() => {
    return complaints.filter(c => {
      // Public only sees approved unless in Admin view
      if (!isAdminMode && c.status !== 'Approved') return false;
      const matchesSearch = c.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                            c.summary.toLowerCase().includes(searchQuery.toLowerCase()) ||
                            c.id.toLowerCase().includes(searchQuery.toLowerCase());
      const matchesCat = categoryFilter === 'All' || c.category === categoryFilter;
      return matchesSearch && matchesCat;
    });

  const filteredEvidence = useMemo(() => {
    return evidenceItems.filter(e => {
      const matchesSearch = e.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                            e.description.toLowerCase().includes(searchQuery.toLowerCase());
      return matchesSearch;
    });
  }, [evidenceItems, searchQuery]);

    e.preventDefault();
    if (!submitForm.consent) {
      alert("Please confirm the authorization and truthfulness disclosure.");
      return;
    }

    setIsUploading(true);
    // Simulate streaming file upload directly to Google Drive API
    setTimeout(() => {
      const newId = `CMP-2026-${Math.floor(100 + Math.random() * 900)}`;
      const newRecord = {
        id: newId,
        submitter: submitForm.displayPref === 'Anonymous' ? 'Anonymous' : `${submitForm.privateName.charAt(0) || 'U'}***`,
        relationship: submitForm.relationship,
        courseDate: submitForm.courseDate || 'Recent',
        dateSubmitted: new Date().toISOString().split('T')[0],
        title: submitForm.title,
        summary: submitForm.summary,
        category: submitForm.category,
        status: 'Pending',
        evidenceCount: submitForm.fileAttached ? 1 : 0,
        evidenceRefs: [],
        providerResponseId: null,
        verifiedPurchase: false,
        privateEmail: submitForm.privateEmail,
        privateName: submitForm.privateName
      };

      setComplaints(prev => [newRecord, ...prev]);
      setIsUploading(false);
      setSubmissionSuccess(true);
      triggerToast("Submission successfully stored in private queue & Google Drive storage bucket!");

        displayPref: 'Masked name',

        privateEmail: '',
        courseDate: '',
        title: '',
        summary: '',
        category: 'Course Content',
        fileAttached: null,
        refLinks: '',

    setComplaints(prev => prev.map(c => c.id === id ? { ...c, status: 'Approved' } : c));

    setComplaints(prev => prev.map(c => c.id === id ? { ...c, status: 'Rejected' } : c));

                <div className="w-3 bg-emerald-500 h-52 rounded-sm relative"><div className="absolute -top-12 left-1/2 -translate-x-1/2 w-0.5 h-72 bg-emerald-400"></div></div>

            <div className="text-[11px] font-mono text-slate-500 bg-slate-950 p-2 rounded flex items-center justify-between">
              <span>Redaction Note: {selectedEvidenceModal.redactionNotes}</span>
              <span>GDrive Sync: OK</span>
            </div>

          </div>
        </div>
      )}

      {/* 3. GLOBAL SEARCH MODAL */}
      {showSearchModal && (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-start justify-center pt-20 px-4">
          <div className="bg-slate-900 border border-slate-800 rounded-xl max-w-xl w-full p-4 shadow-2xl space-y-4">
            <div className="relative">
              <Search className="w-5 h-5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" />
              <input 
                type="text" 
                autoFocus
                placeholder="Search across all records, evidence, and claims..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full bg-slate-950 border border-slate-800 rounded-lg pl-10 pr-10 py-3 text-sm text-white focus:outline-none focus:border-red-500"
              />
              <button onClick={() => setShowSearchModal(false)} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
                <X className="w-5 h-5" />
              </button>
            </div>

            <div className="text-xs font-mono text-slate-500 px-1">
              Pressing Search filters active dataset. Click below to view results in directory.
            </div>

            <button 
              onClick={() => { setShowSearchModal(false); setActiveTab('complaints'); }}
              className="w-full py-2 bg-red-600 hover:bg-red-500 text-white text-xs font-semibold rounded-lg"
            >
              Apply Filter & View Directory
            </button>
          </div>
        </div>
      )}

      {/* 4. LEGAL DOCUMENTS MODAL */}
      {legalModalContent && (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-xl max-w-xl w-full p-6 shadow-2xl relative space-y-4 text-xs text-slate-300">
            <button 
              onClick={() => setLegalModalContent(null)}
              className="absolute top-4 right-4 p-1.5 text-slate-400 hover:text-white rounded-lg bg-slate-950 border border-slate-800"
            >
              <X className="w-5 h-5" />
            </button>

            <h2 className="text-lg font-bold text-white uppercase font-mono">
              {legalModalContent === 'terms' && 'Terms of Use'}
              {legalModalContent === 'privacy' && 'Privacy Policy'}
              {legalModalContent === 'handling' && 'Evidence Handling Protocol'}
            </h2>

            <div className="max-h-72 overflow-y-auto space-y-3 leading-relaxed p-3 bg-slate-950 rounded border border-slate-800">
              <p>
                10xTrader Watch operates under strict fair-use and public interest guidelines. We do not host defamatory or unverified personal attacks.
              </p>
              <p>
                <strong>Private Data Storage:</strong> Original submitted files containing unredacted credentials, names, or banking details are stored strictly in private, non-public Google Drive buckets accessed only by authorized human moderators.
              </p>
              <p>
                <strong>Correction Policy:</strong> If you are a representative of 10xTrader and wish to submit a formal response or request a factual correction, please utilize our Provider Response portal.
              </p>
            </div>

            <div className="pt-2 flex justify-end">
              <button 
                onClick={() => setLegalModalContent(null)}
                className="px-4 py-2 bg-slate-800 text-white rounded text-xs font-semibold"
              >
                I Understand
              </button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

  </script>
</body>
</html>
