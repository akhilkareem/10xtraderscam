<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10xTrader Watch — Consumer Awareness Platform</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 UMD Scripts -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#07090e] text-slate-200 font-sans min-h-screen flex flex-col">
  
  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxmo88hrElpBl6V3o7j0MPDuxiWYwHXvph4Rrd1nx_AbYJw2vB3hXQIT8jvaX4FwsM5/exec";
    const ADMIN_PASSWORD = "10xadmin2026";

    const INITIAL_COMPLAINTS = [
      {
        id: 'CMP-2026-089',
        submitter: 'M*** K.',
        relationship: 'Student',
        courseDate: 'March 2026',
        dateSubmitted: '2026-04-12',
        title: 'Promised 1-on-1 Mentorship Was Automated Bot Messages',
        summary: 'The VIP enrollment package ($4,999) explicitly advertised daily personalized live coaching and trade reviews by the master trader. In reality, all direct support was handled by an unmonitored automated Telegram bot sending recycled chart signals from 2023.',
        category: 'Misleading Claims',
        status: 'Approved',
        privateName: 'Marcus Vance',
        privateEmail: 'marcus@example.com'
      },
      {
        id: 'CMP-2026-074',
        submitter: 'Anonymous',
        relationship: 'Student',
        courseDate: 'January 2026',
        dateSubmitted: '2026-03-28',
        title: 'Refund Policy Denied After 48 Hours Despite 30-Day Guarantee',
        summary: 'The promotional page offered a "No-Questions-Asked 30-Day Refund Policy". When requested on day 5 due to missing module materials, support claimed that viewing >10% of video content rendered the account non-refundable according to hidden terms.',
        category: 'Refund Policy',
        status: 'Approved',
        privateName: 'Sarah Jenkins',
        privateEmail: 'sarah@private.net'
      }
    ];

    const INITIAL_EVIDENCE = [
      { id: 'EV-101', title: 'Refund Policy Sales Page Screenshot', category: 'Course Advertisements', date: '2026-03-29', description: 'Promotional landing page displaying bold "30-Day Guarantee" text without disclaimers.', status: 'Verified' },
      { id: 'EV-102', title: 'Telegram Support Log Transcript', category: 'Chat Excerpts', date: '2026-04-10', description: 'Exported chat history demonstrating automated macro replies to complex mentorship questions.', status: 'Verified' }
    ];

    const INITIAL_RESPONSES = [
      { id: 'RESP-001', relatedComplaintId: 'CMP-2026-089', date: '2026-04-15', author: '10xTrader Official Operations Team', status: 'Verified Authentic', text: 'We acknowledge that during our high-volume enrollment week our VIP queue experienced latency.' }
    ];

    function App() {
      const [isAdminMode, setIsAdminMode] = useState(false);
      const [adminAuthenticated, setAdminAuthenticated] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      const [activeTab, setActiveTab] = useState('home');
      const [complaints, setComplaints] = useState(INITIAL_COMPLAINTS);
      const [evidenceItems, setEvidenceItems] = useState(INITIAL_EVIDENCE);
      const [responses, setResponses] = useState(INITIAL_RESPONSES);
      const [toastMessage, setToastMessage] = useState(null);

      const [submitForm, setSubmitForm] = useState({
        relationship: 'Student',
        displayPref: 'Masked name',
        privateName: '',
        privateEmail: '',
        title: '',
        summary: '',
        category: 'Course Content',
        rawFile: null,
        consent: false
      });
      const [submissionSuccess, setSubmissionSuccess] = useState(false);
      const [isUploading, setIsUploading] = useState(false);

      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 4000);
      };

      const stats = useMemo(() => ({
        totalSubmitted: complaints.length,
        reviewed: complaints.filter(c => c.status === 'Approved').length,
        evidenceCount: evidenceItems.length,
        complaintsCount: complaints.filter(c => c.status === 'Approved').length
      }), [complaints, evidenceItems]);

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (passwordInput === ADMIN_PASSWORD) {
          setAdminAuthenticated(true);
          setIsAdminMode(true);
          setPasswordInput('');
          triggerToast("Admin portal unlocked");
        } else {
          alert("Incorrect password. Access denied.");
        }
      };

      const handleApprove = (id) => {
        setComplaints(prev => prev.map(c => c.id === id ? { ...c, status: 'Approved' } : c));
        triggerToast(`Complaint ${id} approved & published to public directory!`);
      };

      const handleDeleteComplaint = (id) => {
        if (confirm(`Are you sure you want to permanently delete complaint ${id}?`)) {
          setComplaints(prev => prev.filter(c => c.id !== id));
          triggerToast(`Complaint ${id} permanently removed.`);
        }
      };

      const handleDeleteEvidence = (id) => {
        if (confirm(`Are you sure you want to delete evidence entry ${id}?`)) {
          setEvidenceItems(prev => prev.filter(e => e.id !== id));
          triggerToast(`Evidence ${id} removed.`);
        }
      };

      const handleSubmission = async (e) => {
        e.preventDefault();
        if (!submitForm.consent) {
          alert("Please confirm authorization.");
          return;
        }

        setIsUploading(true);

        try {
          let base64File = "";
          let fileName = "";
          let fileType = "";

          if (submitForm.rawFile) {
            fileName = submitForm.rawFile.name;
            fileType = submitForm.rawFile.type;
            base64File = await new Promise((resolve) => {
              const reader = new FileReader();
              reader.onload = (evt) => resolve(evt.target.result);
              reader.readAsDataURL(submitForm.rawFile);
            });
          }

          const payload = {
            title: submitForm.title,
            summary: submitForm.summary,
            category: submitForm.category,
            relationship: submitForm.relationship,
            displayPref: submitForm.displayPref,
            privateName: submitForm.privateName,
            privateEmail: submitForm.privateEmail,
            fileName: fileName,
            fileType: fileType,
            fileData: base64File
          };

          await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
          });

          const newId = `CMP-2026-${Math.floor(100 + Math.random() * 900)}`;
          const newRecord = {
            id: newId,
            submitter: submitForm.displayPref === 'Anonymous' ? 'Anonymous' : `${submitForm.privateName.charAt(0) || 'U'}***`,
            relationship: submitForm.relationship,
            courseDate: 'Recent',
            dateSubmitted: new Date().toISOString().split('T')[0],
            title: submitForm.title,
            summary: submitForm.summary,
            category: submitForm.category,
            status: 'Pending',
            privateName: submitForm.privateName,
            privateEmail: submitForm.privateEmail
          };

          setComplaints(prev => [newRecord, ...prev]);

          if (fileName) {
            const newEvId = `EV-${Math.floor(100 + Math.random() * 900)}`;
            setEvidenceItems(prev => [{
              id: newEvId,
              title: submitForm.title + " (Attached File)",
              category: submitForm.category,
              date: new Date().toISOString().split('T')[0],
              description: `Uploaded file: ${fileName}. Stored in Google Drive vault.`,
              status: 'Pending Review'
            }, ...prev]);
          }

          setSubmissionSuccess(true);
          triggerToast("Submission saved to Google Drive & added to review queue!");
        } catch (err) {
          alert("Error connecting to upload service.");
        } finally {
          setIsUploading(false);
        }
      };

      return (
        <div className="min-h-screen bg-[#07090e] text-slate-200 flex flex-col justify-between">
          
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 border border-emerald-500/50 text-emerald-400 px-5 py-3 rounded-lg shadow-2xl">
              <span className="text-sm font-medium">{toastMessage}</span>
            </div>
          )}

          {/* HEADER */}
          <header className="sticky top-0 z-40 bg-[#0a0d14]/90 backdrop-blur-md border-b border-slate-800">
            <div className="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('home')}>
                <div className="w-10 h-10 rounded-lg bg-gradient-to-br from-red-600 to-red-900 flex items-center justify-center border border-red-500/30">
                  <span className="font-extrabold text-white text-lg">10x</span>
                </div>
                <div>
                  <span className="text-xl font-extrabold text-white uppercase font-mono">10xTrader<span className="text-red-500">Watch</span></span>
                  <p className="text-xs text-slate-400">Real traders. Real stories.</p>
                </div>
              </div>

              <nav className="hidden lg:flex items-center gap-1 text-sm font-medium">
                {[
                  { id: 'home', label: 'Home' },
                  { id: 'what-we-found', label: 'What We Found' },
                  { id: 'complaints', label: `Complaints (${complaints.filter(c => c.status === 'Approved').length})` },
                  { id: 'evidence', label: `Evidence Gallery (${evidenceItems.length})` },
                  { id: 'responses', label: 'Provider Responses' },
                  { id: 'submit', label: 'Submit Evidence' },
                  { id: 'about', label: 'About' }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => { setActiveTab(item.id); setSubmissionSuccess(false); }}
                    className={`px-3 py-2 rounded-md transition ${
                      activeTab === item.id ? 'text-white bg-slate-800 border border-slate-700' : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    {item.label}
                  </button>
                ))}
              </nav>

              <div className="flex items-center gap-2 bg-slate-900 border border-slate-800 rounded-lg p-1 text-xs">
                <button onClick={() => { setIsAdminMode(false); setAdminAuthenticated(false); setActiveTab('home'); }} className={`px-2.5 py-1 rounded ${!isAdminMode ? 'bg-red-600 text-white' : 'text-slate-400'}`}>Public</button>
                <button onClick={() => setActiveTab('admin')} className={`px-2.5 py-1 rounded ${isAdminMode ? 'bg-cyan-600 text-white' : 'text-slate-400'}`}>Admin</button>
              </div>
            </div>
          </header>

          <main className="flex-1 pb-16">

            {/* HOME VIEW */}
            {activeTab === 'home' && (
              <div>
                <section className="pt-16 pb-16 px-4 max-w-7xl mx-auto">
                  <span className="inline-block px-3 py-1 rounded-full bg-red-950 border border-red-800 text-red-400 text-xs font-mono mb-4">
                    Independent Consumer Awareness Platform
                  </span>
                  <h1 className="text-4xl sm:text-6xl font-extrabold text-white">
                    The Truth Behind <span className="text-red-500">10xTrader</span>
                  </h1>
                  <p className="mt-4 text-xl text-slate-300">Big promises. High fees. Make informed decisions.</p>
                  <p className="mt-4 text-slate-400 max-w-2xl">
                    Explore submitted student experiences, course materials, and supporting evidence to help prospective students ask better questions before paying for a trading course.
                  </p>
                  <div className="mt-8 flex flex-wrap gap-4">
                    <button onClick={() => setActiveTab('complaints')} className="px-6 py-3 rounded-lg bg-red-600 text-white font-semibold hover:bg-red-500">View Complaints ({stats.complaintsCount})</button>
                    <button onClick={() => setActiveTab('submit')} className="px-6 py-3 rounded-lg bg-slate-900 border border-slate-700 text-slate-200 hover:bg-slate-800">Submit Experience</button>
                  </div>
                </section>

                {/* STATS STRIP */}
                <section className="bg-slate-900/80 border-y border-slate-800 py-8 px-4 mb-12">
                  <div className="max-w-7xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                    <div className="p-4 bg-slate-950 rounded-xl border border-slate-800">
                      <div className="text-2xl font-bold text-white font-mono">{stats.totalSubmitted}</div>
                      <div className="text-xs text-slate-400 mt-1">Submitted Accounts</div>
                    </div>
                    <div className="p-4 bg-slate-950 rounded-xl border border-slate-800">
                      <div className="text-2xl font-bold text-cyan-400 font-mono">{stats.reviewed}</div>
                      <div className="text-xs text-slate-400 mt-1">Approved & Published</div>
                    </div>
                    <div className="p-4 bg-slate-950 rounded-xl border border-slate-800">
                      <div className="text-2xl font-bold text-emerald-400 font-mono">{stats.evidenceCount}</div>
                      <div className="text-xs text-slate-400 mt-1">Evidence Files</div>
                    </div>
                    <div className="p-4 bg-slate-950 rounded-xl border border-slate-800">
                      <div className="text-2xl font-bold text-red-400 font-mono">{stats.complaintsCount}</div>
                      <div className="text-xs text-slate-400 mt-1">Public Complaints</div>
                    </div>
                  </div>
                </section>
              </div>
            )}

            {/* WHAT WE FOUND TAB */}
            {activeTab === 'what-we-found' && (
              <div className="max-w-7xl mx-auto px-4 py-12">
                <h1 className="text-3xl font-bold text-white mb-2">Investigation Report Matrix</h1>
                <p className="text-slate-400 text-sm mb-8">Detailed comparison of marketing claims versus verified student reports.</p>
                <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
                  <table className="w-full text-left text-sm text-slate-300">
                    <thead className="bg-slate-950 text-slate-400 font-mono text-xs uppercase border-b border-slate-800">
                      <tr>
                        <th className="p-4">Category</th>
                        <th className="p-4 text-emerald-400">Promotional Claim</th>
                        <th className="p-4 text-red-400">Student Reports</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800">
                      <tr>
                        <td className="p-4 font-bold text-white">Mentorship Support</td>
                        <td className="p-4 bg-emerald-950/10">Daily 1-on-1 live coaching by master trader.</td>
                        <td className="p-4 bg-red-950/10">Unmonitored automated Telegram bot messages.</td>
                      </tr>
                      <tr>
                        <td className="p-4 font-bold text-white">Refund Guarantee</td>
                        <td className="p-4 bg-emerald-950/10">30-day no-questions-asked money-back guarantee.</td>
                        <td className="p-4 bg-red-950/10">Refunds denied if video viewing exceeds 10%.</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* COMPLAINTS DIRECTORY TAB */}
            {activeTab === 'complaints' && (
              <div className="max-w-7xl mx-auto px-4 py-12">
                <div className="flex justify-between items-center mb-6">
                  <div>
                    <h1 className="text-3xl font-bold text-white">Student Complaints Directory</h1>
                    <p className="text-slate-400 text-sm mt-1">Showing all approved student accounts and verified complaints.</p>
                  </div>
                  <button onClick={() => setActiveTab('submit')} className="px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-lg text-sm font-semibold">
                    + Submit Experience
                  </button>
                </div>

                {complaints.filter(c => c.status === 'Approved').length === 0 ? (
                  <div className="bg-slate-900 border border-slate-800 p-8 rounded-xl text-center text-slate-400 text-sm">
                    No approved complaints currently listed in public directory.
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {complaints.filter(c => c.status === 'Approved').map(item => (
                      <div key={item.id} className="bg-slate-900 border border-slate-800 p-6 rounded-xl flex flex-col justify-between">
                        <div>
                          <div className="flex justify-between text-xs text-slate-500 font-mono mb-2">
                            <span className="bg-slate-800 text-slate-300 px-2 py-0.5 rounded">{item.id}</span>
                            <span>{item.dateSubmitted}</span>
                          </div>
                          <h3 className="text-lg font-bold text-white mb-2">{item.title}</h3>
                          <p className="text-sm text-slate-300 leading-relaxed mb-4">{item.summary}</p>
                        </div>

                        <div className="pt-4 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
                          <span className="bg-red-950 text-red-400 px-2 py-0.5 rounded border border-red-800/40">{item.category}</span>
                          <span>Submitter: <strong>{item.submitter}</strong></span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* EVIDENCE GALLERY TAB */}
            {activeTab === 'evidence' && (
              <div className="max-w-7xl mx-auto px-4 py-12">
                <h1 className="text-3xl font-bold text-white mb-2">Redacted Evidence Gallery</h1>
                <p className="text-slate-400 text-sm mb-8">Archived specimens with personal data redacted for privacy.</p>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {evidenceItems.map(item => (
                    <div key={item.id} className="bg-slate-900 border border-slate-800 p-6 rounded-xl">
                      <div className="flex justify-between items-center mb-2">
                        <span className="text-xs font-mono text-cyan-400">{item.id} • {item.category}</span>
                        <span className="text-[10px] font-mono text-emerald-400 bg-emerald-950 border border-emerald-800 px-2 py-0.5 rounded">{item.status}</span>
                      </div>
                      <h3 className="text-lg font-bold text-white mb-2">{item.title}</h3>
                      <p className="text-xs text-slate-300">{item.description}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* PROVIDER RESPONSES TAB */}
            {activeTab === 'responses' && (
              <div className="max-w-7xl mx-auto px-4 py-12">
                <h1 className="text-3xl font-bold text-white mb-2">Provider Responses (Right of Reply)</h1>
                <p className="text-slate-400 text-sm mb-8">Authenticated statements issued by course leadership.</p>
                <div className="space-y-4">
                  {responses.map(resp => (
                    <div key={resp.id} className="bg-slate-900 border border-amber-900/40 p-6 rounded-xl">
                      <span className="text-xs font-mono text-amber-400 bg-amber-950 px-2 py-0.5 rounded">{resp.status}</span>
                      <h3 className="text-lg font-bold text-white mt-2 mb-1">{resp.author}</h3>
                      <p className="text-sm text-slate-300">{resp.text}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* SUBMIT EVIDENCE TAB */}
            {activeTab === 'submit' && (
              <div className="max-w-2xl mx-auto px-4 py-12">
                <h1 className="text-3xl font-bold text-white mb-2">Submit Your Experience</h1>
                <p className="text-slate-400 text-sm mb-8">Submissions route directly to your private Google Drive folder.</p>

                {submissionSuccess ? (
                  <div className="bg-slate-900 border border-emerald-500/50 p-8 rounded-xl text-center">
                    <h2 className="text-2xl font-bold text-emerald-400 mb-2">Submission Received</h2>
                    <p className="text-slate-300 text-sm mb-6">Your data has been securely saved to Google Drive and placed in the moderation queue.</p>
                    <button onClick={() => setSubmissionSuccess(false)} className="px-6 py-2 bg-slate-800 text-white rounded-lg text-sm">Submit Another</button>
                  </div>
                ) : (
                  <form onSubmit={handleSubmission} className="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4">
                    <div>
                      <label className="block text-xs font-mono text-slate-400 mb-1">Relationship to Course *</label>
                      <select value={submitForm.relationship} onChange={e => setSubmitForm({...submitForm, relationship: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-sm text-white">
                        <option value="Student">Former / Active Student</option>
                        <option value="Course provider or team">Course Provider</option>
                        <option value="Other">Other</option>
                      </select>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1">Full Name (Confidential) *</label>
                        <input type="text" required value={submitForm.privateName} onChange={e => setSubmitForm({...submitForm, privateName: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-sm text-white" />
                      </div>
                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1">Email (Confidential) *</label>
                        <input type="email" required value={submitForm.privateEmail} onChange={e => setSubmitForm({...submitForm, privateEmail: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-sm text-white" />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-mono text-slate-400 mb-1">Experience Title *</label>
                      <input type="text" required value={submitForm.title} onChange={e => setSubmitForm({...submitForm, title: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-sm text-white" />
                    </div>

                    <div>
                      <label className="block text-xs font-mono text-slate-400 mb-1">Detailed Account *</label>
                      <textarea rows={4} required value={submitForm.summary} onChange={e => setSubmitForm({...submitForm, summary: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-sm text-white"></textarea>
                    </div>

                    <div>
                      <label className="block text-xs font-mono text-slate-400 mb-1">Upload Screenshot / Evidence File</label>
                      <input type="file" onChange={e => setSubmitForm({...submitForm, rawFile: e.target.files[0]})} className="text-xs text-slate-400 block w-full" />
                    </div>

                    <div className="flex items-start gap-2 pt-2">
                      <input type="checkbox" id="c" checked={submitForm.consent} onChange={e => setSubmitForm({...submitForm, consent: e.target.checked})} className="mt-1" />
                      <label htmlFor="c" className="text-xs text-slate-400">I confirm that this experience is accurate and true.</label>
                    </div>

                    <button type="submit" disabled={isUploading} className="w-full py-3 bg-red-600 hover:bg-red-500 text-white font-bold rounded-lg transition">
                      {isUploading ? "Uploading to Google Drive..." : "Submit Evidence"}
                    </button>
                  </form>
                )}
              </div>
            )}

            {/* ABOUT TAB */}
            {activeTab === 'about' && (
              <div className="max-w-3xl mx-auto px-4 py-12">
                <h1 className="text-3xl font-bold text-white mb-6">About 10xTrader Watch</h1>
                <div className="bg-slate-900 border border-slate-800 p-8 rounded-xl space-y-4 text-sm text-slate-300">
                  <p><strong>10xTrader Watch</strong> is an independent consumer awareness platform dedicated to bringing transparency to retail trading education courses.</p>
                  <p>All submissions are manually reviewed by moderators, and personal credentials are kept confidential in private Google Drive storage buckets.</p>
                </div>
              </div>
            )}

            {/* ADMIN DASHBOARD WITH PASSWORD PROTECTION & DELETE CONTROL */}
            {activeTab === 'admin' && (
              <div className="max-w-4xl mx-auto px-4 py-12">
                {!adminAuthenticated ? (
                  <form onSubmit={handleAdminLogin} className="max-w-md mx-auto bg-slate-900 border border-slate-800 p-8 rounded-xl space-y-4 shadow-2xl">
                    <h2 className="text-2xl font-bold text-white text-center">Admin Password Protected</h2>
                    <p className="text-xs text-slate-400 text-center">Enter administrative credentials to manage moderation queue.</p>
                    <input 
                      type="password" 
                      placeholder="Enter Admin Password"
                      value={passwordInput}
                      onChange={e => setPasswordInput(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded p-3 text-sm text-white focus:outline-none focus:border-red-500"
                    />
                    <button type="submit" className="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-lg transition">
                      Unlock Admin Workspace
                    </button>
                  </form>
                ) : (
                  <div className="space-y-8">
                    
                    <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                      <div>
                        <h1 className="text-2xl font-bold text-cyan-400">Moderator Control Portal</h1>
                        <p className="text-xs text-slate-400">Approve, decline, or permanently delete submitted entries.</p>
                      </div>
                      <button onClick={() => { setAdminAuthenticated(false); setIsAdminMode(false); setActiveTab('home'); }} className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs font-semibold">
                        Lock Workspace
                      </button>
                    </div>

                    {/* Pending Approvals Queue */}
                    <div>
                      <h3 className="text-lg font-bold text-amber-400 mb-3 flex items-center gap-2">
                        Pending Approvals Queue ({complaints.filter(c => c.status === 'Pending').length})
                      </h3>

                      {complaints.filter(c => c.status === 'Pending').length === 0 ? (
                        <div className="bg-slate-900 border border-slate-800 p-6 rounded-xl text-slate-500 text-sm">
                          No pending submissions awaiting approval.
                        </div>
                      ) : (
                        <div className="space-y-4">
                          {complaints.filter(c => c.status === 'Pending').map(item => (
                            <div key={item.id} className="bg-slate-900 border border-slate-800 p-5 rounded-xl flex flex-col md:flex-row justify-between md:items-center gap-4">
                              <div>
                                <div className="flex items-center gap-2 text-xs font-mono mb-1">
                                  <span className="bg-amber-950 text-amber-400 px-2 py-0.5 rounded border border-amber-800/50">{item.id}</span>
                                  <span className="text-slate-400">Private Name: {item.privateName || 'N/A'}</span>
                                  <span className="text-slate-500">({item.privateEmail || 'N/A'})</span>
                                </div>
                                <h4 className="font-bold text-white text-base">{item.title}</h4>
                                <p className="text-xs text-slate-300 mt-1 line-clamp-2">{item.summary}</p>
                              </div>

                              <div className="flex items-center gap-2 shrink-0">
                                <button onClick={() => handleApprove(item.id)} className="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-xs font-semibold">
                                  Approve & Publish
                                </button>
                                <button onClick={() => handleDeleteComplaint(item.id)} className="px-3.5 py-1.5 bg-red-950 hover:bg-red-900 text-red-400 border border-red-800 rounded text-xs font-semibold">
                                  Delete
                                </button>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    {/* All Managed Complaints (With Delete Option) */}
                    <div>
                      <h3 className="text-lg font-bold text-slate-200 mb-3">
                        Published Directory Entries ({complaints.filter(c => c.status === 'Approved').length})
                      </h3>

                      <div className="space-y-3">
                        {complaints.filter(c => c.status === 'Approved').map(item => (
                          <div key={item.id} className="bg-slate-950 border border-slate-800/80 p-4 rounded-lg flex justify-between items-center text-xs">
                            <div>
                              <span className="font-mono text-cyan-400 mr-2">{item.id}</span>
                              <span className="font-bold text-white">{item.title}</span>
                            </div>
                            <button onClick={() => handleDeleteComplaint(item.id)} className="px-2.5 py-1 bg-red-950 text-red-400 hover:bg-red-900 border border-red-800/60 rounded font-semibold">
                              Remove
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* All Managed Evidence Entries */}
                    <div>
                      <h3 className="text-lg font-bold text-slate-200 mb-3">
                        Managed Evidence Files ({evidenceItems.length})
                      </h3>

                      <div className="space-y-3">
                        {evidenceItems.map(item => (
                          <div key={item.id} className="bg-slate-950 border border-slate-800/80 p-4 rounded-lg flex justify-between items-center text-xs">
                            <div>
                              <span className="font-mono text-cyan-400 mr-2">{item.id}</span>
                              <span className="font-bold text-white">{item.title}</span>
                            </div>
                            <button onClick={() => handleDeleteEvidence(item.id)} className="px-2.5 py-1 bg-red-950 text-red-400 hover:bg-red-900 border border-red-800/60 rounded font-semibold">
                              Remove
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>

                  </div>
                )}
              </div>
            )}

          </main>

          <footer className="bg-[#05070a] border-t border-slate-800 py-8 px-4 text-center text-xs text-slate-500 font-mono">
            © 2026 10xTrader Watch. Independent Consumer Research Platform.
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
