<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10xTrader Watch — Consumer Awareness Platform</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 UMD Scripts -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#07090e] text-slate-200 font-sans min-h-screen flex flex-col justify-between selection:bg-red-600 selection:text-white">
  
  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxmo88hrElpBl6V3o7j0MPDuxiWYwHXvph4Rrd1nx_AbYJw2vB3hXQIT8jvaX4FwsM5/exec";
    const STORAGE_KEY = "10xtrader-watch-v3";
    const ADMIN_PASSWORD_HASH = "MTB4YWRtaW4yMDI2";

    // JSONP backend caller
    function callBackend(action, params = {}) {
      return new Promise((resolve, reject) => {
        const callbackName = "__xwatch_cb_" + Math.random().toString(36).slice(2);
        const script = document.createElement("script");
        let finished = false;
        const finish = (err, result) => {
          if (finished) return;
          finished = true;
          clearTimeout(timeout);
          try { delete window[callbackName]; } catch (_) { window[callbackName] = undefined; }
          script.remove();
          err ? reject(err) : resolve(result);
        };
        const timeout = setTimeout(() => finish(new Error("Google Apps Script did not respond to action=" + action)), 15000);
        window[callbackName] = result => {
          if (!result || result.ok === false) return finish(new Error(result?.error || "Backend request failed."));
          finish(null, result);
        };
        const query = new URLSearchParams({ action, callback: callbackName, ...params });
        script.src = GOOGLE_SCRIPT_URL + "?" + query.toString();
        script.onerror = () => finish(new Error("Could not reach the Google Apps Script web app."));
        document.head.appendChild(script);
      });
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("Could not read file."));
        reader.readAsDataURL(file);
      });
    }

    const maskName = (fullName) => {
      if (!fullName || fullName.toLowerCase() === 'anonymous') return 'Anonymous';
      const parts = fullName.trim().split(' ');
      const first = parts[0];
      const last = parts.length > 1 ? parts[parts.length - 1] : '';
      return `${first.charAt(0)}*** ${last ? last.charAt(0) + '.' : ''}`.trim();
    };

    const INITIAL_COMPLAINTS = [
 {
        id: 'CMP-2026-097',
        submitter: 'P****.',
        paid: '₹35,000 paid',
        relationship: 'Student',
        dateSubmitted: '20 Oct 2024',
        title: '“I bought this course for such a high price after seeing the Instagram stories and promises. But the strategy wasn’t working then, and it still isn’t working for me now. The funny part is, it didn’t even seem to work during the live class sessions! Only after losing money did I learn that it was based on a key-level concept within MSNR, despite it being presented as his own developed concept. I feel misled by what was promised versus what I actually learned.”',
        category: 'Course Content',
        tag2: 'Misleading Claims',
        status: 'Approved',
        privateEmail: 'pramith@example.com'
      },
       {
        id: 'CMP-2026-097',
        submitter: 'P****.',
        paid: '₹35,000 paid',
        relationship: 'Student',
        dateSubmitted: '20 Oct 2024',
        title: '“I was in first offline batch - Almost all days- the entry taken in class itself was SL. and Later it was fully SL. Then only came to know it was just a key level in MSNR concept and when asked about it on instagram, he blocked me. Also support is fake- Discord only 3 months and then later pay.He takes entries using liquidity n other SMC concept and taught us only just a OCL concept.”',
        category: 'Course Content',
        tag2: 'Misleading Claims',
        status: 'Approved',
        privateEmail: 'pramith@example.com'
      },
      {
        id: 'CMP-2026-089',
        submitter: 'S*** P.',
        paid: '₹35,000 paid',
        relationship: 'Student',
        dateSubmitted: '14 Oct 2024',
        title: '“They said we will learn full strategy in the 5-day course it was only OCL level. No live trading, no real setups.”',
        category: 'Course Content',
        tag2: 'Misleading Claims',
        status: 'Approved',
        privateEmail: 'sneha@example.com'
      },
      {
        id: 'CMP-2026-074',
        submitter: 'R*** S.',
        paid: '₹30,000 paid',
        relationship: 'Student',
        dateSubmitted: '12 Oct 2024',
        title: '“During classes he kept saying \'wait for liquidity\' & \'check ICT concepts\'. But when we tried to follow it, we just got confused.”',
        category: 'Aggressive Behaviour',
        tag2: 'False Promises',
        status: 'Approved',
        privateEmail: 'rahul@example.com'
      },
      {
        id: 'CMP-2026-061',
        submitter: 'A**** K.',
        paid: '₹33,000 paid',
        relationship: 'Student',
        dateSubmitted: '08 Oct 2024',
        title: '“They promised support and lifetime access. But after the payment, they stopped replying on WhatsApp.”',
        category: 'No Support',
        tag2: 'No Refund',
        status: 'Approved',
        privateEmail: 'ananya@example.com'
      },
      {
        id: 'CMP-2026-052',
        submitter: 'V**** M.',
        paid: '₹35,000 paid',
        relationship: 'Student',
        dateSubmitted: '05 Oct 2024',
        title: '“I asked for the full syllabus before joining. They said it will be shared in the class. Nothing was shared.”',
        category: 'False Information',
        tag2: 'Withheld Details',
        status: 'Approved',
        privateEmail: 'vikram@example.com'
      }
    ];

    const INITIAL_EVIDENCE = [
      { id: 'EV-101', title: 'Instagram Ad — Course Promotion', category: 'Screenshot from Instagram', date: '2024-10-01', description: 'Promotional ad promising live trading and lifetime support.' },
      { id: 'EV-102', title: 'UPI Transaction Screenshot', category: 'Payment Proof', date: '2024-10-05', description: '₹35,000 payment transfer confirmation to course provider.' },
      { id: 'EV-103', title: 'Chat Transcript with Instructor', category: 'Telegram Chat', date: '2024-10-10', description: 'Instructor stating OCL level is enough to be profitable.' },
      { id: 'EV-104', title: 'Day 1 Course Material Outline', category: 'Shared PDF Note', date: '2024-10-12', description: 'Basic introductory slide deck showing lack of advanced modules.' }
    ];

    function App() {
      let savedState = null;
      try { savedState = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); } catch (_) {}
      
      const [adminAuthenticated, setAdminAuthenticated] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      const [showAdminModal, setShowAdminModal] = useState(false);
      
      const [complaints, setComplaints] = useState(savedState?.complaints || INITIAL_COMPLAINTS);
      const [evidenceItems, setEvidenceItems] = useState(savedState?.evidenceItems || INITIAL_EVIDENCE);
      const [backendMessage, setBackendMessage] = useState("");
      const [isSyncing, setIsSyncing] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      // Save to localStorage whenever complaints change
      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ complaints, evidenceItems })); }
        catch (_) {}
      }, [complaints, evidenceItems]);

      const normalizeComplaint = (c, i) => {
        const status = String(c.status || c.reviewStatus || "Pending");
        const titleText = c.title || c.summary || c.description || "Submission";
        const formattedTitle = titleText.startsWith("“") ? titleText : `“${titleText}”`;
        return {
          id: String(c.id || c.ID || c.submissionId || ("CMP-" + (i + 1))),
          submitter: c.submitter || maskName(c.privateName || c.name || ""),
          paid: c.paid || c.paidAmount || "₹35,000 paid",
          relationship: c.relationship || "Student",
          dateSubmitted: c.dateSubmitted || c.date || c.timestamp || c.submittedAt || new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
          title: formattedTitle,
          category: c.category || "Course Content",
          tag2: c.tag2 || status,
          status: /approve|publish/i.test(status) ? "Approved" : (/reject|declin/i.test(status) ? "Rejected" : "Pending"),
          privateEmail: c.privateEmail || c.email || ""
        };
      };

      // AUTOMATIC SYNC: Fetch from Google backend on page load for EVERY visitor
      useEffect(() => {
        const syncWithDrive = async () => {
          try {
            const result = await callBackend("list");
            if (result && Array.isArray(result.complaints)) {
              const driveComplaints = result.complaints.map(normalizeComplaint);
              
              setComplaints(prev => {
                // Merge Drive complaints with INITIAL_COMPLAINTS so samples are never lost
                const driveIds = new Set(driveComplaints.map(dc => dc.id));
                const uniqueInitials = INITIAL_COMPLAINTS.filter(ic => !driveIds.has(ic.id));
                return [...driveComplaints, ...uniqueInitials];
              });
            }
          } catch (err) {
            // Falls back to localStorage / initial state silently if offline
          }
        };
        syncWithDrive();
      }, []);

      const refreshAdminQueue = async () => {
        setIsSyncing(true);
        setBackendMessage("");
        try {
          const result = await callBackend("list");
          if (!Array.isArray(result.complaints)) throw new Error("Invalid response format.");
          const driveComplaints = result.complaints.map(normalizeComplaint);
          
          setComplaints(prev => {
            const driveIds = new Set(driveComplaints.map(dc => dc.id));
            const uniqueInitials = INITIAL_COMPLAINTS.filter(ic => !driveIds.has(ic.id));
            return [...driveComplaints, ...uniqueInitials];
          });

          if (Array.isArray(result.evidenceItems)) setEvidenceItems(result.evidenceItems);
          setBackendMessage("Synced successfully with Google backend.");
          triggerToast("Queue updated from Google Drive!");
        } catch (err) {
          setBackendMessage(err.message);
        } finally { setIsSyncing(false); }
      };

      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 4000);
      };

      const stats = useMemo(() => ({
        totalSubmitted: complaints.length + 48,
        reviewed: complaints.filter(c => c.status === 'Approved').length + 27,
        reportedAmount: "12.4 L+",
        evidenceCount: evidenceItems.length + 13
      }), [complaints, evidenceItems]);

      const handleAdminLogin = (e) => {
        e.preventDefault();
        try {
          if (btoa(passwordInput) === ADMIN_PASSWORD_HASH) {
            setAdminAuthenticated(true);
            setPasswordInput('');
            setShowAdminModal(false);
            triggerToast("Admin portal unlocked successfully!");
            setTimeout(() => {
              document.getElementById('admin-panel')?.scrollIntoView({ behavior: 'smooth' });
            }, 100);
          } else {
            alert("Incorrect admin password.");
          }
        } catch (err) {
          alert("Incorrect admin password.");
        }
      };

      const handleApprove = async (id) => {
        try {
          await callBackend("approve", { id });
          setComplaints(prev => prev.map(c => c.id === id ? { ...c, status: "Approved", tag2: "Approved" } : c));
          triggerToast(`Complaint ${id} approved.`);
        } catch (err) { alert("Approval error: " + err.message); }
      };

      const handleReject = async (id) => {
        try {
          await callBackend("reject", { id });
          setComplaints(prev => prev.map(c => c.id === id ? { ...c, status: "Rejected", tag2: "Rejected" } : c));
          triggerToast(`Complaint ${id} rejected.`);
        } catch (err) { alert("Rejection error: " + err.message); }
      };

      const handleDeleteComplaint = async (id) => {
        if (!confirm(`Permanently delete complaint ${id}?`)) return;
        try {
          await callBackend("delete", { id });
          setComplaints(prev => prev.filter(c => c.id !== id));
          triggerToast(`Complaint ${id} deleted.`);
        } catch (err) { alert("Deletion error: " + err.message); }
      };

      const handleDeleteEvidence = (id) => {
        if (confirm(`Permanently delete evidence ${id}?`)) {
          setEvidenceItems(prev => prev.filter(e => e.id !== id));
          triggerToast(`Evidence ${id} deleted.`);
        }
      };

      const [submitForm, setSubmitForm] = useState({
        relationship: 'Student',
        privateName: '',
        privateEmail: '',
        paidAmount: '₹35,000 paid',
        title: '',
        summary: '',
        category: 'Course Content',
        rawFile: null,
        consent: false
      });
      const [submissionSuccess, setSubmissionSuccess] = useState(false);
      const [isUploading, setIsUploading] = useState(false);

      const handleSubmission = async (e) => {
        e.preventDefault();
        if (!submitForm.consent) { alert("Please confirm authorization checkbox."); return; }
        if (submitForm.rawFile && submitForm.rawFile.size > 5 * 1024 * 1024) { alert("Please upload a file smaller than 5 MB."); return; }
        setIsUploading(true);
        try {
          const fileData = submitForm.rawFile ? await readFileAsDataURL(submitForm.rawFile) : "";
          const payload = {
            id: "CMP-" + Math.floor(100000 + Math.random() * 900000),
            title: submitForm.title.trim(),
            summary: submitForm.summary.trim(),
            category: submitForm.category,
            relationship: submitForm.relationship,
            privateName: submitForm.privateName.trim(),
            privateEmail: submitForm.privateEmail.trim(),
            paidAmount: submitForm.paidAmount,
            fileName: submitForm.rawFile?.name || "",
            fileMimeType: submitForm.rawFile?.type || "",
            fileData,
            status: "Pending",
            submittedAt: new Date().toISOString()
          };
          
          await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST", mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({ action: "submit", ...payload })
          });
          
          const newRecord = normalizeComplaint({
            ...payload, submitter: maskName(payload.privateName), paid: payload.paidAmount,
            dateSubmitted: new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }),
            title: `“${payload.title}: ${payload.summary}”`, status: "Pending", privateEmail: payload.privateEmail
          });
          setComplaints(prev => [newRecord, ...prev.filter(c => c.id !== newRecord.id)]);
          setSubmissionSuccess(true);
          triggerToast("Submission sent successfully!");
          setSubmitForm(prev => ({ ...prev, privateName: "", privateEmail: "", title: "", summary: "", rawFile: null, consent: false }));
          const fileInput = document.getElementById("evidence-file"); if (fileInput) fileInput.value = "";
        } catch (err) {
          alert("Submission error: " + err.message);
        } finally { setIsUploading(false); }
      };

      return (
        <div className="min-h-screen bg-[#07090e] text-slate-200 font-sans flex flex-col justify-between selection:bg-red-600 selection:text-white">
          
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 border border-emerald-500/50 text-emerald-400 px-5 py-3 rounded-lg shadow-2xl">
              <span className="text-sm font-medium">{toastMessage}</span>
            </div>
          )}

          {/* ADMIN LOGIN MODAL */}
          {showAdminModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 p-8 rounded-xl max-w-md w-full relative">
                <button onClick={() => setShowAdminModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
                <h3 className="text-xl font-bold text-white mb-2">Admin Portal Login</h3>
                <p className="text-xs text-slate-400 mb-6">Enter password to review pending submissions and manage entries.</p>
                
                {adminAuthenticated ? (
                  <div className="space-y-4">
                    <p className="text-emerald-400 text-sm font-semibold">✓ Admin session active</p>
                    <button onClick={() => { setShowAdminModal(false); setTimeout(() => { document.getElementById('admin-panel')?.scrollIntoView({ behavior: 'smooth' }); }, 100); }} className="w-full py-2.5 bg-red-600 text-white rounded-lg font-bold text-sm">Go to Admin Portal Below</button>
                  </div>
                ) : (
                  <form onSubmit={handleAdminLogin} className="space-y-4">
                    <input 
                      type="password" 
                      placeholder="Admin Password"
                      value={passwordInput}
                      onChange={e => setPasswordInput(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded p-3 text-sm text-white focus:outline-none focus:border-cyan-500"
                    />
                    <button type="submit" className="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-lg transition text-sm">
                      Unlock Admin Controls
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* HEADER / NAV */}
          <header className="sticky top-0 z-40 bg-[#07090e]/95 backdrop-blur-md border-b border-slate-800/80">
            <div className="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => window.scrollTo({top: 0, behavior: 'smooth'})}>
                <div className="w-10 h-10 rounded-lg bg-gradient-to-br from-red-600 to-red-900 flex items-center justify-center border border-red-500/30 shadow-lg">
                  <span className="font-extrabold text-white text-lg">10x</span>
                </div>
                <div>
                  <span className="text-xl font-extrabold text-white uppercase tracking-wider font-mono">10xTrader<span className="text-red-500">Watch</span></span>
                  <p className="text-[10px] text-slate-400">Real traders. Real stories.</p>
                </div>
              </div>

              <nav className="hidden lg:flex items-center gap-6 text-xs font-semibold text-slate-300">
                <a href="#hero" className="hover:text-white transition">Home</a>
                <a href="#analysis" className="hover:text-white transition">What We Found</a>
                <a href="#claims" className="hover:text-white transition">Course Claims</a>
                <a href="#evidence" className="hover:text-white transition">Evidence</a>
                <a href="#complaints" className="hover:text-white transition">Complaints ({complaints.filter(c => c.status === 'Approved').length})</a>
                <a href="#submit" className="hover:text-white transition">Submit Evidence</a>
                <a href="#about" className="hover:text-white transition">About</a>
              </nav>

              <div className="flex items-center gap-3">
                <button onClick={() => setShowAdminModal(true)} className="px-3.5 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-cyan-400 hover:bg-slate-800 text-xs font-mono font-bold">
                  {adminAuthenticated ? "⚙️ Admin Active" : "Admin Login"}
                </button>
              </div>
            </div>
          </header>

          <main className="flex-1">

            {/* HERO SECTION */}
            <section id="hero" className="relative pt-12 pb-20 px-4 max-w-7xl mx-auto">
              <div className="bg-gradient-to-r from-red-950/40 via-slate-900 to-slate-950 border border-red-900/30 rounded-2xl p-8 sm:p-12 relative overflow-hidden shadow-2xl">
                <div className="absolute top-0 right-0 w-96 h-96 bg-red-600/10 rounded-full blur-3xl pointer-events-none"></div>
                
                <div className="inline-block px-3 py-1 rounded-md bg-red-600/20 border border-red-500/30 text-red-400 text-xs font-mono mb-4">
                  CONSUMER AWARENESS PLATFORM
                </div>
                
                <h1 className="text-4xl sm:text-6xl font-extrabold text-white tracking-tight leading-tight">
                  The Truth Behind <span className="text-red-500">10xTrader</span>
                </h1>
                
                <p className="mt-4 text-lg text-slate-300 max-w-2xl">
                  Big promises. High fees. Little to no real trading knowledge. We’ve gathered real student experiences, screenshots, and proof that show what 10xTrader really delivers — and how it’s not living up to its claims.
                </p>

                <div className="mt-8 flex flex-wrap gap-4">
                  <a href="#complaints" className="px-6 py-3 rounded-lg bg-red-600 hover:bg-red-500 text-white font-bold text-sm shadow-lg shadow-red-600/30 transition">
                    Explore All Complaints →
                  </a>
                  <a href="#submit" className="px-6 py-3 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-200 font-bold text-sm transition">
                    Submit Your Experience
                  </a>
                </div>
              </div>
            </section>

            {/* STATS STRIP */}
            <section className="bg-slate-900/90 border-y border-slate-800 py-8 px-4 mb-16">
              <div className="max-w-7xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-6 text-center">
                <div className="p-4 bg-slate-950/60 rounded-xl border border-slate-800/80">
                  <div className="text-3xl font-extrabold text-white font-mono">{stats.totalSubmitted}</div>
                  <div className="text-xs text-slate-400 mt-1">Total Submissions (Students & Viewers)</div>
                </div>
                <div className="p-4 bg-slate-950/60 rounded-xl border border-slate-800/80">
                  <div className="text-3xl font-extrabold text-cyan-400 font-mono">{stats.reviewed}</div>
                  <div className="text-xs text-slate-400 mt-1">Verified Purchasers (With proof)</div>
                </div>
                <div className="p-4 bg-slate-950/60 rounded-xl border border-slate-800/80">
                  <div className="text-3xl font-extrabold text-emerald-400 font-mono">₹{stats.reportedAmount}</div>
                  <div className="text-xs text-slate-400 mt-1">Total Reported Amount (Based on evidence)</div>
                </div>
                <div className="p-4 bg-slate-950/60 rounded-xl border border-slate-800/80">
                  <div className="text-3xl font-extrabold text-red-400 font-mono">17</div>
                  <div className="text-xs text-slate-400 mt-1">Official Complaints Filed (NCH / Cyber Crime)</div>
                </div>
              </div>
            </section>

            {/* WHAT WE FOUND & CLAIMS */}
            <section id="analysis" className="max-w-7xl mx-auto px-4 mb-20">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div className="lg:col-span-5 space-y-4">
                  <div className="w-1.5 h-8 bg-red-600 rounded-full"></div>
                  <h2 className="text-2xl sm:text-3xl font-bold text-white">What We Found</h2>
                  <p className="text-sm text-slate-300 leading-relaxed">
                    10xTrader markets itself as a high-level trading mentorship program, claiming to teach a full strategy that anyone can learn — even if you are a beginner. However, multiple students have reported that the actual content delivered was limited to just OCL level of MSNR, with no real trading sessions, no advanced concepts, and no practical execution of the strategies promised.
                  </p>
                  <a href="#complaints" className="inline-block text-xs font-bold text-red-400 hover:text-red-300 pt-2">Read Full Report →</a>
                </div>

                <div id="claims" className="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-xl p-6 sm:p-8">
                  <h3 className="text-lg font-bold text-white mb-6">What They Promised vs What They Delivered</h3>
                  
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="space-y-3">
                      <h4 className="text-xs font-mono font-bold text-emerald-400 uppercase tracking-wider">What They Promised</h4>
                      {[
                        "Complete trading strategy (SMC, ICT, Liquidity, etc.)",
                        "Live trading sessions & real setups",
                        "Proven results & profitable strategy",
                        "Beginner friendly & easy to learn",
                        "Lifetime support / doubt clearing"
                      ].map((item, idx) => (
                        <div key={idx} className="flex items-start gap-2.5 bg-emerald-950/20 border border-emerald-900/40 p-3 rounded-lg text-xs text-slate-200">
                          <span className="text-emerald-400 font-bold">✓</span>
                          <span>{item}</span>
                        </div>
                      ))}
                    </div>

                    <div className="space-y-3">
                      <h4 className="text-xs font-mono font-bold text-red-400 uppercase tracking-wider">What They Delivered</h4>
                      {[
                        "Only OCL level of MSNR",
                        "No live trading / only theory",
                        "No results, even during classes",
                        "Confusing for freshers",
                        "Limited / unresponsive"
                      ].map((item, idx) => (
                        <div key={idx} className="flex items-start gap-2.5 bg-red-950/20 border border-red-900/40 p-3 rounded-lg text-xs text-slate-200">
                          <span className="text-red-400 font-bold">✕</span>
                          <span>{item}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* RECENT COMPLAINTS GRID */}
            <section id="complaints" className="max-w-7xl mx-auto px-4 mb-20">
              <div className="flex justify-between items-end mb-8">
                <div>
                  <div className="w-1.5 h-8 bg-red-600 rounded-full mb-3"></div>
                  <h2 className="text-2xl sm:text-3xl font-bold text-white">Recent Complaints</h2>
                </div>
                <span className="text-xs font-mono text-slate-400">Showing Approved Student Accounts</span>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                {complaints.filter(c => c.status === 'Approved').map((item) => (
                  <div key={item.id} className="bg-slate-900 border border-slate-800 rounded-xl p-6 flex flex-col justify-between shadow-xl hover:border-slate-700 transition">
                    <div>
                      <div className="flex items-center gap-3 mb-4">
                        <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-cyan-600 to-indigo-600 flex items-center justify-center font-bold text-white text-sm">
                          {item.submitter.charAt(0)}
                        </div>
                        <div>
                          <h4 className="font-bold text-white text-sm">{item.submitter}</h4>
                          <span className="text-[11px] font-mono text-emerald-400">{item.paid}</span>
                        </div>
                      </div>

                      <p className="text-sm text-slate-300 italic leading-relaxed mb-6">
                        {item.title}
                      </p>
                    </div>

                    <div>
                      <div className="text-[10px] text-slate-500 font-mono mb-3">{item.dateSubmitted}</div>
                      <div className="flex flex-wrap gap-2">
                        <span className="px-2.5 py-1 rounded bg-red-950/60 border border-red-800/40 text-red-400 text-[10px] font-semibold">{item.category}</span>
                        {item.tag2 && <span className="px-2.5 py-1 rounded bg-slate-800 text-slate-300 text-[10px] font-semibold">{item.tag2}</span>}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </section>

            {/* EVIDENCE GALLERY GRID */}
            <section id="evidence" className="max-w-7xl mx-auto px-4 mb-20">
              <div className="flex justify-between items-end mb-8">
                <div>
                  <div className="w-1.5 h-8 bg-cyan-500 rounded-full mb-3"></div>
                  <h2 className="text-2xl sm:text-3xl font-bold text-white">Evidence Gallery</h2>
                </div>
                <span className="text-xs font-mono text-slate-400">Archived Screenshots & Proof</span>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                {evidenceItems.map((item) => (
                  <div key={item.id} className="bg-slate-900 border border-slate-800 rounded-xl p-6 flex flex-col justify-between shadow-xl">
                    <div>
                      <span className="text-[10px] font-mono text-cyan-400 bg-cyan-950 px-2 py-0.5 rounded border border-cyan-800/40">{item.category}</span>
                      <h4 className="font-bold text-white text-base mt-3 mb-2">{item.title}</h4>
                      <p className="text-xs text-slate-300 mb-6">{item.description}</p>
                    </div>
                    <div className="text-[10px] font-mono text-slate-500 pt-3 border-t border-slate-800">
                      Archived: {item.date}
                    </div>
                  </div>
                ))}
              </div>
            </section>

            {/* SUBMIT EXPERIENCE SECTION */}
            <section id="submit" className="max-w-3xl mx-auto px-4 mb-20">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-8 sm:p-10 shadow-2xl">
                <div className="text-center mb-8">
                  <span className="px-3 py-1 rounded-md bg-red-950 border border-red-800 text-red-400 text-xs font-mono">
                    SECURE SUBMISSION VAULT
                  </span>
                  <h2 className="text-3xl font-bold text-white mt-3">Submit Your Experience</h2>
                  <p className="text-sm text-slate-400 mt-1">Files and details route directly to your private Database.</p>
                </div>

                {submissionSuccess ? (
                  <div className="bg-slate-950 border border-emerald-500/50 p-8 rounded-xl text-center space-y-4">
                    <h3 className="text-2xl font-bold text-emerald-400">Submission Received Successfully!</h3>
                    <p className="text-slate-300 text-sm">Your complaint has been saved to the Database and placed in the admin review queue.</p>
                    <button onClick={() => setSubmissionSuccess(false)} className="px-6 py-2.5 bg-slate-800 text-white rounded-lg text-sm font-semibold">Submit Another</button>
                  </div>
                ) : (
                  <form onSubmit={handleSubmission} className="space-y-5">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1">Your Name *</label>
                        <input type="text" required value={submitForm.privateName} onChange={e => setSubmitForm({...submitForm, privateName: e.target.value})} placeholder="e.g. Rahul V." className="w-full bg-slate-950 border border-slate-800 rounded p-3 text-sm text-white" />
                      </div>
                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1">Email (Confidential) *</label>
                        <input type="email" required value={submitForm.privateEmail} onChange={e => setSubmitForm({...submitForm, privateEmail: e.target.value})} placeholder="rahul@example.com" className="w-full bg-slate-950 border border-slate-800 rounded p-3 text-sm text-white" />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1">Amount Paid / Course Package *</label>
                        <input type="text" required value={submitForm.paidAmount} onChange={e => setSubmitForm({...submitForm, paidAmount: e.target.value})} placeholder="e.g. ₹35,000 paid" className="w-full bg-slate-950 border border-slate-800 rounded p-3 text-sm text-white" />
                      </div>
                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1">Complaint Category *</label>
                        <select value={submitForm.category} onChange={e => setSubmitForm({...submitForm, category: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-3 text-sm text-white">
                          <option value="Course Content">Course Content</option>
                          <option value="Aggressive Behaviour">Aggressive Behaviour</option>
                          <option value="No Support">No Support / Refund Refused</option>
                          <option value="False Information">False Information</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-mono text-slate-400 mb-1">Short Quote / Title *</label>
                      <input type="text" required value={submitForm.title} onChange={e => setSubmitForm({...submitForm, title: e.target.value})} placeholder="e.g. Promised live mentorship but received bots" className="w-full bg-slate-950 border border-slate-800 rounded p-3 text-sm text-white" />
                    </div>

                    <div>
                      <label className="block text-xs font-mono text-slate-400 mb-1">Detailed Account *</label>
                      <textarea rows={4} required value={submitForm.summary} onChange={e => setSubmitForm({...submitForm, summary: e.target.value})} placeholder="Describe your experience in detail..." className="w-full bg-slate-950 border border-slate-800 rounded p-3 text-sm text-white"></textarea>
                    </div>

                    <div>
                      <label className="block text-xs font-mono text-slate-400 mb-1">Upload Screenshot / Evidence File</label>
                      <input id="evidence-file" type="file" accept="image/*,.pdf,.doc,.docx,.txt" onChange={e => setSubmitForm({...submitForm, rawFile: e.target.files[0]})} className="text-xs text-slate-400 block w-full file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-white hover:file:bg-slate-700 cursor-pointer" />
                    </div>

                    <div className="flex items-start gap-3 pt-2">
                      <input type="checkbox" id="consent" checked={submitForm.consent} onChange={e => setSubmitForm({...submitForm, consent: e.target.checked})} className="mt-1 w-4 h-4 rounded accent-red-600" />
                      <label htmlFor="consent" className="text-xs text-slate-400">I confirm that this experience is accurate and true to the best of my knowledge.</label>
                    </div>

                    <button type="submit" disabled={isUploading} className="w-full py-4 bg-red-600 hover:bg-red-500 text-white font-extrabold rounded-xl transition shadow-lg shadow-red-600/30">
                      {isUploading ? "Uploading to Database..." : "Submit Experience & Evidence"}
                    </button>
                  </form>
                )}
              </div>
            </section>

            {/* ADMIN MODERATION PANEL (UNLOCKED WHEN LOGGED IN) */}
            {adminAuthenticated && (
              <section id="admin-panel" className="max-w-5xl mx-auto px-4 mb-24">
                <div className="bg-slate-900 border-2 border-cyan-500/50 rounded-2xl p-8 shadow-2xl space-y-8">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                    <div>
                      <span className="px-2.5 py-1 rounded bg-cyan-950 text-cyan-400 text-xs font-mono">MODERATOR MODE</span>
                      <h2 className="text-2xl font-bold text-white mt-1">Admin Management Portal</h2>
                    </div>
                    <button onClick={() => setAdminAuthenticated(false)} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-semibold">
                      Lock Session
                    </button>
                  </div>

                  <div className="flex flex-wrap items-center justify-between gap-3 bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <p className="text-xs text-slate-400">{backendMessage || "Queue is synced automatically on page load."}</p>
                    <button onClick={refreshAdminQueue} disabled={isSyncing} className="px-4 py-2 bg-cyan-700 hover:bg-cyan-600 disabled:opacity-50 text-white rounded-lg text-xs font-bold transition">
                      {isSyncing ? "Syncing..." : "Refresh from Google backend"}
                    </button>
                  </div>

                  {/* Pending Queue */}
                  <div>
                    <h3 className="text-lg font-bold text-amber-400 mb-4">Pending Submissions Queue ({complaints.filter(c => c.status === 'Pending').length})</h3>
                    {complaints.filter(c => c.status === 'Pending').length === 0 ? (
                      <p className="text-slate-500 text-sm bg-slate-950 p-4 rounded-xl">No pending submissions awaiting review.</p>
                    ) : (
                      <div className="space-y-4">
                        {complaints.filter(c => c.status === 'Pending').map(item => (
                          <div key={item.id} className="bg-slate-950 border border-slate-800 p-5 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                              <span className="text-xs font-mono text-amber-400 bg-amber-950 px-2 py-0.5 rounded mr-2">{item.id}</span>
                              <span className="text-xs text-slate-400">{item.privateEmail}</span>
                              <h4 className="font-bold text-white text-base mt-1">{item.title}</h4>
                            </div>
                            <div className="flex items-center gap-2 shrink-0">
                              <button onClick={() => handleApprove(item.id)} className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold">Approve & Publish</button>
                              <button onClick={() => handleReject(item.id)} className="px-4 py-2 bg-amber-700 hover:bg-amber-600 text-white rounded-lg text-xs font-bold">Reject</button>
                              <button onClick={() => handleDeleteComplaint(item.id)} className="px-4 py-2 bg-red-950 hover:bg-red-900 text-red-400 rounded-lg text-xs font-bold">Delete</button>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  {/* Published Complaints Control */}
                  <div>
                    <h3 className="text-lg font-bold text-white mb-4">Manage Published Complaints ({complaints.filter(c => c.status === 'Approved').length})</h3>
                    <div className="space-y-3">
                      {complaints.filter(c => c.status === 'Approved').map(item => (
                        <div key={item.id} className="bg-slate-950 border border-slate-800 p-4 rounded-xl flex justify-between items-center text-xs">
                          <div>
                            <span className="font-mono text-cyan-400 mr-2">{item.id}</span>
                            <span className="font-bold text-white">{item.submitter}: {item.title}</span>
                          </div>
                          <button onClick={() => handleDeleteComplaint(item.id)} className="px-3 py-1.5 bg-red-950 hover:bg-red-900 text-red-400 rounded font-bold">Remove</button>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Evidence Gallery Control */}
                  <div>
                    <h3 className="text-lg font-bold text-white mb-4">Manage Evidence Items ({evidenceItems.length})</h3>
                    <div className="space-y-3">
                      {evidenceItems.map(item => (
                        <div key={item.id} className="bg-slate-950 border border-slate-800 p-4 rounded-xl flex justify-between items-center text-xs">
                          <div>
                            <span className="font-mono text-cyan-400 mr-2">{item.id}</span>
                            <span className="font-bold text-white">{item.title}</span>
                          </div>
                          <button onClick={() => handleDeleteEvidence(item.id)} className="px-3 py-1.5 bg-red-950 hover:bg-red-900 text-red-400 rounded font-bold">Remove</button>
                        </div>
                      ))}
                    </div>
                  </div>

                </div>
              </section>
            )}

            {/* ABOUT SECTION */}
            <section id="about" className="max-w-4xl mx-auto px-4 mb-20">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-8 sm:p-10 space-y-4 text-sm text-slate-300">
                <h3 className="text-xl font-bold text-white">About 10xTrader Truth & Awareness</h3>
                <p>This platform is an independent consumer research initiative dedicated to providing transparency on retail trading courses. All data and proof files submitted by students are stored securely in encrypted Database vaults.</p>
                <p className="text-xs text-slate-500 font-mono">© 2026 10xTrader Truth & Awareness. All rights reserved. This website is a consumer awareness platform and not affiliated with 10xTrader.</p>
              </div>
            </section>

          </main>

          {/* FOOTER */}
          <footer className="bg-[#05070a] border-t border-slate-800 py-12 px-4">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6 text-xs text-slate-400">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded bg-red-600 flex items-center justify-center font-bold text-white">10x</div>
                <span className="font-bold text-white">10xTrader Truth & Awareness</span>
              </div>
              
              <div className="flex flex-wrap gap-6 font-medium">
                <a href="#hero" className="hover:text-white transition">Home</a>
                <a href="#analysis" className="hover:text-white transition">What We Found</a>
                <a href="#claims" className="hover:text-white transition">Course Claims</a>
                <a href="#evidence" className="hover:text-white transition">Evidence</a>
                <a href="#complaints" className="hover:text-white transition">Complaints</a>
                <a href="#submit" className="hover:text-white transition">Submit Evidence</a>
                <a href="#about" className="hover:text-white transition">About</a>
              </div>

              <div className="text-slate-500 text-[11px]">
                This website is a consumer awareness platform and not affiliated with 10xTrader.
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
